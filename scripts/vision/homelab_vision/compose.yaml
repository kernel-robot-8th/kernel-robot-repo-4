# homelab-vision: omen-8 에서 나중에 쓸 구성. 2a 단계에서는 실행하지 않았다(GPU 항목은 2b).
# 실행 전 조건: 이미지 homelab-vision:20261110 이 그 PC 에 있어야 하고(여기서는 빌드하지 않는다),
# NVIDIA 드라이버와 nvidia-container-toolkit 이 있어야 한다.
name: homelab-vision

services:
  vision:
    image: homelab-vision:20261110
    container_name: homelab-vision
    network_mode: host            # 듣는 포트 없음. 카메라(HTTP)와 브로커(MQTT)로 나가기만 한다.
    restart: "no"
    cpus: 4
    mem_limit: 4g
    read_only: true               # 프레임을 포함해 아무것도 디스크에 쓰지 못하게 한다
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PUBLISH: "false"            # 기본은 발행 안 함. true 로 바꾸는 것은 사용자 결정 뒤에만.
      MQTT_BROKER: "192.168.0.3"
      MQTT_PORT: "1883"
      CAMERA_SOURCE: "http://192.168.0.7:18086/processed"
      INFERENCE_FPS: "10"
      DEVICE: "auto"              # cuda 가 보이면 cuda, 아니면 cpu
      STATUS_LOG_SEC: "10"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
