# homelab-vision: 비전 근거 컨테이너 구성 (장비별 값은 targets/<장비>.env, Jenkins vision-model-release 가 풀어 쓴다).
# 실행 전 조건: IMAGE_TAG 이미지가 그 PC 에 있어야 하고(여기서는 빌드하지 않는다),
# NVIDIA 드라이버와 nvidia-container-toolkit 이 있어야 한다. 컨테이너를 손으로 띄우지 않는다(운영 규칙).
#
# 변수 우선순위(docker compose 규칙): 실행하는 셸의 환경 변수 > --env-file(targets/*.env) > 아래 ${이름:-기본}.
# 손으로 실행할 때는 셸에 같은 이름 변수가 남아 있지 않은지 확인한다. Jenkins 는 셸의 같은 이름 값을 지우고
# targets/*.env 를 기준으로 쓴다(PUBLISH 매개변수가 env 파일과 다르면 빌드가 멈춘다).
# PUBLISH 를 true 로 하는 것은 사용자 결정 뒤에만, 그리고 발행은 항상 한 장비에서만 한다(두 곳이면 같은 주제에
# 발행자가 둘이 되고 수신기는 증상 없이 섞어 받는다). 기본값은 발행 안 함(false)이다.
name: homelab-vision

services:
  vision:
    image: ${IMAGE_TAG:?missing IMAGE_TAG}
    container_name: homelab-vision
    network_mode: host            # 듣는 포트 없음. 카메라(HTTP)와 브로커(MQTT)로 나가기만 한다.
    restart: "no"
    cpus: 4
    mem_limit: 4g
    read_only: true               # 프레임을 포함해 아무것도 디스크에 쓰지 못하게 한다
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PUBLISH: "${PUBLISH:-false}"   # 기본은 발행 안 함. true 로 바꾸는 것은 사용자 결정 뒤에만.
      MQTT_BROKER: "${MQTT_BROKER:-192.168.0.8}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      CAMERA_SOURCE: "${CAMERA_SOURCE:-http://192.168.0.7:18086/processed}"
      INFERENCE_FPS: "${INFERENCE_FPS:-10}"
      INFER_IMGSZ: "${INFER_IMGSZ:-960}"
      DEVICE: "${DEVICE:-cuda}"      # auto 는 GPU 가 없으면 조용히 cpu 로 내려가므로 cuda 로 고정한다
      STATUS_LOG_SEC: "${STATUS_LOG_SEC:-10}"
      TARGET_HOST: "${TARGET_HOST:-unknown}"   # 상태 메시지에 넣는 장비 이름(호스트 이름에 기대지 않는다)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
