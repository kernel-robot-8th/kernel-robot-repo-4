# OpenManipulator-F BringUp Initial Pose & Torque Configuration
init_pose:
  joint_base: 0.0          # Base Yaw (rad)
  joint_shoulder: -0.35    # Shoulder Pitch (rad)
  joint_elbow: 0.52        # Elbow Pitch (rad)
  joint_wrist_pitch: 0.0   # Wrist Pitch (rad)
  joint_wrist_roll: 0.0    # Wrist Roll (rad)
  gripper: 0.045           # Gripper opening (m, 0.0=closed, 0.05=fully open)

profile:
  velocity: 60             # Safe moderate speed for BringUp home motion (rev/min)
  acceleration: 20         # Smooth acceleration profile

torque:
  enable: true             # Energize motors on BringUp
  gripper_current_limit_ma: 250  # Grasping current limit in mA
