name: FMS contract
on:
  pull_request:
  push:
    branches: [main, submaster, refactor/control-server-bt-mqtt-db]
permissions:
  contents: read
jobs:
  fms-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install existing Python test dependencies
        run: |
          python3 -m venv /tmp/fms-contract-venv
          /tmp/fms-contract-venv/bin/python -m pip install pytest==8.4.2 PyYAML==6.0.2
      - name: Registry and generated document contract
        env:
          PYTHONPATH: src/cobot_gui
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          /tmp/fms-contract-venv/bin/python -B -m pytest -q -p no:cacheprovider src/cobot_gui/test/test_menu_registry.py src/cobot_gui/test/test_rule_boundaries.py src/cobot_gui/test/test_gen_web_menus.py src/cobot_gui/test/test_gen_web_types.py
          /tmp/fms-contract-venv/bin/python -B -m cobot_gui.menu_registry
          /tmp/fms-contract-venv/bin/python -B -m cobot_gui.gen_menu_doc --check
          /tmp/fms-contract-venv/bin/python -B -m cobot_gui.gen_web_menus --check
          /tmp/fms-contract-venv/bin/python -B -m cobot_gui.gen_web_types --check
  fms-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Web lint, tests, build, offline check, dependency list
        run: |
          docker run --rm -v "$PWD":/repo -w /repo/src/cobot_gui/web node:22.14.0-bookworm sh -c "npm ci --no-audit --no-fund && npm run lint && npm test && npm run build && npm run check:dist && npm run check:deps"
  fleet-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install fleet and existing web API test dependencies
        run: |
          python3 -m venv /tmp/fleet-control-venv
          /tmp/fleet-control-venv/bin/python -m pip install pytest==8.4.2 PyYAML==6.0.2 py_trees==2.2.3 setuptools==75.8.0 fastapi==0.162.0 httpx==0.28.1
      - name: Fleet scenarios and actual control-center HTTP/WebSocket contract
        env:
          # 같은 커밋의 실제 UI 백엔드(cobot_control_center)와 계약을 검증한다.
          PYTHONPATH: src/cobot_control_center:src/cobot_navigation/cobot_pinky_patrol
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          /tmp/fleet-control-venv/bin/python -B -m pytest -q -p no:cacheprovider src/cobot_navigation/cobot_fleet_control/test src/cobot_navigation/cobot_pinky_patrol/test/test_central_guard.py
  fleet-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve deployment and build the complete control image
        working-directory: src/cobot_navigation
        run: |
          bash cobot_fleet_control/config/docker/fleet_docker.sh config
          bash cobot_fleet_control/config/docker/fleet_docker.sh build
      - name: Check web dependencies and launch plan without robot communication
        working-directory: src/cobot_navigation
        run: |
          source cobot_fleet_control/config/docker/versions.env
          docker run --rm --network none "$COBOT_IMAGE" bash -c 'python -c "import py_trees, fastapi, uvicorn; import cobot_control_center.fleet_api_node; import cobot_control_center.fleet_status_node" && ros2 run cobot_fleet_control control_center_web --navigation-root /opt/cobot_ws/src --mode preview --fleet existing'
