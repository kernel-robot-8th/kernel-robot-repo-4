# 시뮬용 도메인 브릿지 (pinky3). 원본: cobot_navigation/cobot_domain_bridge/config/pinky_bridge_pinky3.yaml (2026-11-03)
# 바꾼 곳: 도메인 100 -> 140(시뮬 관제), 30 -> 143(시뮬 pinky3).
# 뺀 곳: /battery_state·차선 토픽 (시뮬 로봇이 내지 않음). 배터리 Float32 두 개는 fake_battery_node 가 낸다. 원본 토픽 목록이 바뀌면 이 파일도 맞춘다.
name: sim_bridge_pinky3

topics:
  /pinky3/patrol_cmd:
    type: std_msgs/msg/String
    from_domain: 140
    to_domain: 143
    remap: /patrol_cmd

  /patrol_status:
    type: std_msgs/msg/String
    from_domain: 143
    to_domain: 140
    remap: /pinky3/patrol_status

  /pinky3/cmd_vel:
    type: geometry_msgs/msg/Twist
    from_domain: 140
    to_domain: 143
    remap: /cmd_vel

  /pinky3/initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 140
    to_domain: 143
    remap: /initialpose

  /pinky3/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 140
    to_domain: 143
    remap: /goal_pose

  /scan:
    type: sensor_msgs/msg/LaserScan
    from_domain: 143
    to_domain: 140
    remap: /pinky3/scan

  /odom:
    type: nav_msgs/msg/Odometry
    from_domain: 143
    to_domain: 140
    remap: /pinky3/odom

  /tf:
    type: tf2_msgs/msg/TFMessage
    from_domain: 143
    to_domain: 140
    remap: /pinky3/tf

  /tf_static:
    type: tf2_msgs/msg/TFMessage
    from_domain: 143
    to_domain: 140
    remap: /pinky3/tf_static

  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 143
    to_domain: 140
    remap: /pinky3/amcl_pose

  /zone_manager/request_entry:
    type: std_msgs/msg/String
    from_domain: 143
    to_domain: 140

  /zone_manager/notify_exit:
    type: std_msgs/msg/String
    from_domain: 143
    to_domain: 140

  /zone_manager/cancel_entry:
    type: std_msgs/msg/String
    from_domain: 143
    to_domain: 140

  /zone_manager/grant_entry:
    type: std_msgs/msg/String
    from_domain: 140
    to_domain: 143

  /zone_manager/queue_slot:
    type: std_msgs/msg/String
    from_domain: 140
    to_domain: 143

  /battery/percent:
    type: std_msgs/msg/Float32
    from_domain: 143
    to_domain: 140
    remap: /pinky3/battery/percent

  /battery/voltage:
    type: std_msgs/msg/Float32
    from_domain: 143
    to_domain: 140
    remap: /pinky3/battery/voltage

  # 중앙 관제(fleet_control) 하트비트. 순찰 노드가 central_controlled 라 이것이 없으면 명령을 받지 않는다
  /pinky3/fleet_heartbeat:
    type: std_msgs/msg/String
    from_domain: 140
    to_domain: 143
    remap: /fleet_heartbeat
