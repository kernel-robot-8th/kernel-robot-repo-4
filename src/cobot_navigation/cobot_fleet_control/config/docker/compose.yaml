name: cobot-fleet

x-runtime: &runtime
  image: ${COBOT_IMAGE:-cobot-fleet:jazzy-scenario-v0.4.0}
  build:
    context: ../../..
    dockerfile: cobot_fleet_control/config/docker/Dockerfile
    args:
      ROS_BASE_IMAGE: ${ROS_BASE_IMAGE:?versions.env를 지정하세요}
      NODE_BUILD_IMAGE: ${NODE_BUILD_IMAGE:?versions.env를 지정하세요}
      SOURCE_REVISION: ${COBOT_SOURCE_REVISION:-unknown}
      SOURCE_DIRTY: ${COBOT_SOURCE_DIRTY:-unknown}
  # Linux 관제 PC의 DDS multicast와 DDS 공유 메모리 경로를 맞춘다.
  network_mode: host
  ipc: host
  init: true
  restart: "no"
  stop_grace_period: 15s
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &ros-environment
    ROS_DOMAIN_ID: "100"
    ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
    ROS_LOCALHOST_ONLY: "0"
    RMW_IMPLEMENTATION: ${COBOT_RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    CYCLONEDDS_URI: ${COBOT_CYCLONEDDS_URI:-file:///opt/cobot/cyclonedds.xml}

services:
  bridge:
    <<: *runtime
    # 로봇별 브릿지. 주행 개발 중인 로봇은 COBOT_PINKYn=false 로 관제에서 뗀다 (기본: 셋 다 연결).
    command:
      - ros2
      - launch
      - cobot_domain_bridge
      - bridges.launch.xml
      - pinky1:=${COBOT_PINKY1:-true}
      - pinky2:=${COBOT_PINKY2:-true}
      - pinky3:=${COBOT_PINKY3:-true}

  zone-manager:
    <<: *runtime
    command: [ros2, launch, cobot_zone_traffic_control, zone_manager.launch.xml]

  fleet:
    <<: *runtime
    depends_on:
      bridge:
        condition: service_started
      zone-manager:
        condition: service_started
    volumes:
      - fleet-data:/var/lib/cobot
    command:
      - ros2
      - run
      - cobot_fleet_control
      - fleet_control_node
      - --ros-args
      - --params-file
      - /opt/cobot_ws/install/share/cobot_fleet_control/config/fleet_control.yaml
      - -p
      - db_path:=/var/lib/cobot/fleet_control.sqlite3
      - -p
      - patrol_config_dir:=/opt/cobot_ws/src/cobot_pinky_patrol/config
      - -p
      - site:=lab

  web:
    <<: *runtime
    # 관제 웨이포인트·묶음 파일 (cobot_control_center waypoint_utils, 기본 경로 ~/.ros/cobot_control_center).
    # 컨테이너를 새 이미지로 다시 만들어도 남게 볼륨에 둔다.
    volumes:
      - web-data:/home/cobot/.ros/cobot_control_center
    depends_on:
      fleet:
        condition: service_started
    command:
      - ros2
      - launch
      - cobot_fleet_control
      - control_center_web.launch.xml
      - navigation_root:=/opt/cobot_ws/src
      - mode:=execute
      - fleet:=existing
      - host:=${COBOT_WEB_HOST:-0.0.0.0}
      - port:=${COBOT_WEB_PORT:-8080}
    healthcheck:
      test:
        - CMD
        - /opt/cobot/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${COBOT_WEB_PORT:-8080}/api/health', timeout=2).close()"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  customer:
    <<: *runtime
    # 고객 핸드폰용 주문 화면. 관제 화면(web)과 포트를 나눠 고객이 관제 화면에 닿지 않게 한다.
    # 주문은 저장하지 않고 fleet 에 요청만 하므로 DB 볼륨이 없다.
    depends_on:
      fleet:
        condition: service_started
    command:
      - ros2
      - run
      - cobot_gui
      - customer_gateway_node
      - --ros-args
      - --params-file
      - /opt/cobot_ws/install/share/cobot_gui/config/customer_gateway.yaml
      - -p
      - port:=${COBOT_CUSTOMER_PORT:-8081}
    healthcheck:
      test:
        - CMD
        - /opt/cobot/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${COBOT_CUSTOMER_PORT:-8081}/customer.html', timeout=2).close()"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  fleet-data:
  web-data:
