name: cobot-fleet

x-runtime: &runtime
  image: ${COBOT_IMAGE:-cobot-fleet:jazzy-scenario-v0.4.0}
  build:
    context: ../../..
    dockerfile: cobot_fleet_control/config/docker/Dockerfile
    args:
      ROS_BASE_IMAGE: ${ROS_BASE_IMAGE:?versions.env를 지정하세요}
      SOURCE_REVISION: ${COBOT_SOURCE_REVISION:-unknown}
      SOURCE_DIRTY: ${COBOT_SOURCE_DIRTY:-unknown}
      CONTROL_CENTER_REVISION: ${CONTROL_CENTER_REVISION:?versions.env를 지정하세요}
  # Linux 관제 PC의 DDS multicast와 DDS 공유 메모리 경로를 맞춘다.
  network_mode: host
  ipc: host
  init: true
  restart: "no"
  stop_grace_period: 15s
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &ros-environment
    ROS_DOMAIN_ID: "100"
    ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
    ROS_LOCALHOST_ONLY: "0"
    RMW_IMPLEMENTATION: ${COBOT_RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    CYCLONEDDS_URI: ${COBOT_CYCLONEDDS_URI:-file:///opt/cobot/cyclonedds.xml}

services:
  bridge:
    <<: *runtime
    command: [ros2, launch, cobot_domain_bridge, bridges.launch.xml]

  zone-manager:
    <<: *runtime
    command: [ros2, launch, cobot_zone_traffic_control, zone_manager.launch.xml]

  fleet:
    <<: *runtime
    depends_on:
      bridge:
        condition: service_started
      zone-manager:
        condition: service_started
    volumes:
      - fleet-data:/var/lib/cobot
    command:
      - ros2
      - run
      - cobot_fleet_control
      - fleet_control_node
      - --ros-args
      - --params-file
      - /opt/cobot_ws/install/share/cobot_fleet_control/config/fleet_control.yaml
      - -p
      - db_path:=/var/lib/cobot/fleet_control.sqlite3
      - -p
      - patrol_config_dir:=/opt/cobot_ws/src/cobot_pinky_patrol/config
      - -p
      - site:=lab

  web:
    <<: *runtime
    depends_on:
      fleet:
        condition: service_started
    command:
      - ros2
      - launch
      - cobot_fleet_control
      - control_center_web.launch.xml
      - navigation_root:=/opt/cobot_ws/src
      - mode:=execute
      - fleet:=existing
      - host:=${COBOT_WEB_HOST:-127.0.0.1}
      - port:=${COBOT_WEB_PORT:-8080}
    healthcheck:
      test:
        - CMD
        - /opt/cobot/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${COBOT_WEB_PORT:-8080}/api/health', timeout=2).close()"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  fleet-data:
