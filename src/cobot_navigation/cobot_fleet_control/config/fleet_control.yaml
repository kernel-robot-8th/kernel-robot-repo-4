fleet_control:
  ros__parameters:
    robot_ids: [pinky1, pinky2, pinky3]
    db_path: ~/.cobot/fleet_control.sqlite3
    tick_sec: 0.1
    heartbeat_sec: 0.5
    # 봉투의 ttl_sec 로 실린다. 순찰 로봇은 시계 비교·TTL 을 하지 않아 보지 않는다 (2026-11-09).
    # 팔·비전 장치 요청(work_request)에도 같은 command_ttl_sec 가 실린다.
    heartbeat_ttl_sec: 3.0
    command_ttl_sec: 5.0
    request_topic: /control_center/task_request
    events_topic: /control_center/task_events
    tasks_topic: /control_center/tasks
    work_request_topic: /fleet/work_request
    work_result_topic: /fleet/work_result
    # 개발 설정: 가짜 핑키·가제보 launch 에서만 true 로 준다. 실물은 false.
    allow_raw_cmd: false        # 개발용 수동 명령 (검사·결과 추적 없이 patrol_cmd 에 문자열)
    start_armed: false          # 작업 명령 켜진 상태로 시작
