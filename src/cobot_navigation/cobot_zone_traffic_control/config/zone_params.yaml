zone_manager_node:
  ros__parameters:
    # zone_gate_client를 쓰는 로봇들의 robot_id 목록 (patrol 노드의 robot_id 파라미터와 일치해야 함)
    robot_ids: ["pinky1", "pinky2", "pinky3"]
    # 로봇이 notify_exit를 못 보내는 비상 상황(크래시 등)에 대비한 강제 해제 시간(초)
    max_hold_sec: 120.0

    # ---- 위험구역 (구역마다 락·대기열·앵커가 따로) ----
    # 구역 이름은 로봇 config/pinkyN.yaml 의 zone_names / ZONE_<이름>_ENTRY 와 같아야 한다 (':' 사용 불가).
    zone_names: ["A", "B"]

    # ---- 대기열 (map 좌표계) ----
    # 슬롯 k = 앵커 + k * spacing * back_dir.  앵커(slot 0)와 후방 벡터는 구역마다 따로 지정한다.
    # 앵커는 로봇 YAML 의 ZONE_<구역>_ENTRY 와 같은 값이어야 하고(테스트가 검사),
    # 점유자의 이탈 경로(ZONE_<구역>_EXIT)와 겹치지 않아야 한다.
    # 앵커 = 로봇 YAML 의 ZONE_<구역>_ENTRY (2026-10-26 사용자 지정값으로 갱신).
    # 구역 A: 슬롯 0:(0.00, 0.60)  1:(-0.30, 0.60)  2:(-0.60, 0.60)   (back_dir -x 기준)
    # 구역 B: 슬롯 0:(-0.80,-0.20)  1:(-1.10,-0.20)  2:(-1.40,-0.20)
    #   TODO(실측): back_dir(-x) 방향 뒤쪽이 맵 안·장애물 없음·다른 로봇 홈(P7 (0.0,-0.6))과 겹치지 않는지 현장 확인.
    zone_A:
      queue_anchor: [0.0, 0.6, 0.0]     # slot 0 위치 [x, y, yaw(rad)]
      queue_back_dir: [-1.0, 0.0]       # 줄이 늘어나는 방향 (자동으로 단위벡터로 정규화)
    zone_B:
      queue_anchor: [-0.8, -0.2, -0.7]  # slot 0 위치 [x, y, yaw(rad)]
      queue_back_dir: [-1.0, 0.0]       # TODO(실측) 후방 방향 확인
    # 아래는 모든 구역 공통
    # 간격 d = 0.30 m (사용자 의도값). 0.20 m 에서는 로봇끼리 부딪혔고, 0.50 m 도 시험했으나 0.30 m 로 확정 (2026-10-14)
    queue_spacing: 0.30                 # 슬롯 간격 d (m)
    queue_max: 3                        # 최대 대기자 수 (넘으면 k=-1 거부)
    queue_stale_sec: 5.0                # request_entry 재전송이 이 시간 끊기면 큐에서 제거
    queue_advance_delay_sec: 3.0        # 앞 로봇이 앵커를 떠날 시간을 준 뒤 뒤 로봇을 전진 (0이면 즉시)
