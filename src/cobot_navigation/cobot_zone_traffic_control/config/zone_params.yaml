zone_manager_node:
  ros__parameters:
    # zone_gate_client를 쓰는 로봇들의 robot_id 목록 (patrol 노드의 robot_id 파라미터와 일치해야 함)
    robot_ids: ["pinky1", "pinky2", "pinky3"]
    # 점유 시간 경고(초). 넘어도 강제로 풀지 않는다 (로봇이 아직 구역 안일 수 있음). notify_exit 전까지 점유 유지
    max_hold_sec: 240.0   # 유휴 복귀(idle_return_sec 120초) + EXIT 이동 시간 동안 매니저가 토큰을 먼저 회수하지 않도록 120 -> 240 (2026-10-27)

    # ---- 위험구역 (구역마다 락·대기열·앵커가 따로) ----
    # 구역 이름은 로봇 config/pinkyN.yaml 의 zone_names 와 같아야 한다 (':' 사용 불가).
    zone_names: ["A", "B", "C"]

    # ---- 대기열 (map 좌표계) ----
    # 슬롯 k = 앵커 + k * spacing * back_dir.  앵커(slot 0)와 후방 벡터는 구역마다 따로 지정한다.
    # 2026-11-04 현장 주행 검증 및 충돌 방지 보정:
    #   구역 A: slot 0 (0.15, 0.50), slot 1 (0.15, 0.12)  (창고 상단 복도)
    #   구역 B: slot 0 (0.35, -0.20), slot 1 (0.35, -0.58) (창고 중하단 복도 분리, A 대기열 및 I1~I3 홈 동선 완전 분리)
    #   구역 C: slot 0 (-0.35, 0.00), slot 1 (-0.35, -0.38) (매장 하차대 ZC 및 중앙 격벽과의 안전거리 0.19m~0.38m 확보)
    zone_A:
      queue_anchor: [0.15, 0.50, 0.0]     # slot 0 위치 [x, y, yaw(rad)] (상차 1 ZA 진입 대기)
      queue_back_dir: [0.0, -1.0]        # 줄이 늘어나는 방향
    zone_B:
      queue_anchor: [0.35, -0.20, 0.0]    # slot 0 위치 (상차 2 ZB 진입 대기 - A와 분리)
      queue_back_dir: [0.0, -1.0]
    zone_C:
      queue_anchor: [-0.35, 0.00, 1.5]    # slot 0 위치 (매장 하차 ZC 진입 대기)
      queue_back_dir: [0.0, -1.0]
    # 아래는 모든 구역 공통
    # 간격 d = 0.38 m (25cm 원형 적재판 장착 시 테두리 간극 13cm 확보하여 접촉 방지)
    queue_spacing: 0.38                 # 슬롯 간격 d (m)
    queue_max: 3                        # 최대 대기자 수 (팀 값 유지. debug 49d8426 의 2 는 병합 때 되돌림)
    queue_stale_sec: 5.0                # request_entry 재전송이 이 시간 끊기면 큐에서 제거
    queue_advance_delay_sec: 3.0        # 앞 로봇이 앵커를 떠날 시간을 준 뒤 뒤 로봇을 전진 (0이면 즉시)
