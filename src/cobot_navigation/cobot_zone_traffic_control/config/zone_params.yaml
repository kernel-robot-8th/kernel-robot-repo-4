zone_manager_node:
  ros__parameters:
    # zone_gate_client를 쓰는 로봇들의 robot_id 목록 (patrol 노드의 robot_id 파라미터와 일치해야 함)
    robot_ids: ["pinky1", "pinky2", "pinky3"]
    # 로봇이 notify_exit를 못 보내는 비상 상황(크래시 등)에 대비한 강제 해제 시간(초)
    max_hold_sec: 240.0   # 유휴 복귀(idle_return_sec 120초) + EXIT 이동 시간 동안 매니저가 토큰을 먼저 회수하지 않도록 120 -> 240 (2026-10-27)

    # ---- 위험구역 (구역마다 락·대기열·앵커가 따로) ----
    # 구역 이름은 순찰 config/sites/<site>.yaml 의 zone_names 와 같아야 한다 (':' 사용 불가).
    zone_names: ["A", "B", "C"]

    # ---- 대기열 (map 좌표계) ----
    # 슬롯 k = 앵커 + k * spacing * back_dir.  앵커(slot 0)와 후방 벡터는 구역마다 따로 지정한다.
    # 앵커 좌표의 유일한 출처는 이 파일이다 (로봇 YAML 에는 대기 위치가 없고 매니저가 슬롯 좌표를 보내 준다).
    # 점유자의 이탈 경로(Z<구역>_EXIT)와 겹치지 않아야 한다.
    # 앵커 = 2026-10-27 사용자 지정값. A·B 는 (0.15, 0.5), C 는 (-0.2, 0.45).
    # 구역 A: 슬롯 0:(0.15, 0.50)  1:(0.15, 0.20)  2:(0.15,-0.10)   (back_dir -y 기준)
    # 구역 B: A 와 같은 대기 위치·yaw (토큰·대기열은 따로)
    # 구역 C: 슬롯 0:(-0.20, 0.45)  1:(-0.20, 0.15)  2:(-0.20,-0.15)  (back_dir -y 기준)
    #   방향을 -y 로 한 이유: +y 슬롯 (0,0.9) 등은 맵 v9 밖(y 최대 0.83)이라 Nav2 가 즉시 거부했다 (2026-10-27). 위 슬롯은 모두 맵의 free 영역.
    #   TODO(실측): 줄이 늘어나는 쪽(-y)에 장애물이 없는지, 다른 로봇 홈과 겹치지 않는지 현장 확인.
    #   주의: A 와 B 는 대기 위치가 같아서, A 대기자와 B 대기자가 동시에 생기면 같은 슬롯으로 가 충돌한다 (매니저가 구역별로 슬롯을 따로 관리).
    #         A·B 슬롯 2 (0.15,-0.10) 는 홈 I1 (0,0) 과 약 0.18 m 로 가깝다. C 슬롯 0 (-0.2,0.45) 은 ZC (-0.5,0.3) 와 약 0.34 m, 줄이 늘어나는 -y 쪽에 ZC_EXIT (-0.2,-0.4) 가 있다 (슬롯 2 와 0.25 m).
    zone_A:
      queue_anchor: [0.15, 0.5, 0.0]     # slot 0 위치 [x, y, yaw(rad)] (2026-10-27 사용자 지정, yaw 0.0 = 정면)
      queue_back_dir: [0.0, -1.0]        # 줄이 늘어나는 방향 (자동으로 단위벡터로 정규화)
    zone_B:
      queue_anchor: [0.15, 0.5, 0.0]     # A 와 같은 대기 위치·yaw (토큰·대기열은 구역별로 따로)
      queue_back_dir: [0.0, -1.0]
    zone_C:
      queue_anchor: [-0.2, 0.45, 1.5]    # slot 0 위치 [x, y, yaw(rad)] (1.5 = 좌측 90°)
      queue_back_dir: [0.0, -1.0]
    # 아래는 모든 구역 공통
    # 간격 d = 0.30 m (사용자 의도값). 0.20 m 에서는 로봇끼리 부딪혔고, 0.50 m 도 시험했으나 0.30 m 로 확정 (2026-10-14)
    queue_spacing: 0.30                 # 슬롯 간격 d (m)
    queue_max: 3                        # 최대 대기자 수 (넘으면 k=-1 거부)
    queue_stale_sec: 5.0                # request_entry 재전송이 이 시간 끊기면 큐에서 제거
    queue_advance_delay_sec: 3.0        # 앞 로봇이 앵커를 떠날 시간을 준 뒤 뒤 로봇을 전진 (0이면 즉시)
