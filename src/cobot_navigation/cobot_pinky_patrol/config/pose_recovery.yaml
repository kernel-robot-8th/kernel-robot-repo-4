# 위치 재설정 노드 파라미터 (노드 이름 pinky_pose_recovery_node)
# 실행: ros2 launch cobot_pinky_patrol pose_recovery.launch.xml robot:=pinky2
#   ROS_DOMAIN_ID 는 장비별로 따로 지정한다 (pinky1=10, pinky2=20, pinky3=30).
# 값은 소수점이 필요한 항목은 반드시 0.0 형태로 쓴다 (정수로 쓰면 파라미터 타입이 달라 시작이 거부된다).
pinky_pose_recovery_node:
  ros__parameters:
    # waypoint 좌표를 읽을 파일(config/pinkyN.yaml). launch 의 robot 인자가 덮어쓴다.
    # 비어 있으면 모든 reset 명령을 FAILED 로 거부한다.
    points_file: ''
    # 이 토픽(std_msgs/String)으로 waypoint 이름(예: P3)을 받으면 그 좌표로 초기 위치를 다시 잡는다
    reset_topic: pose_reset_cmd
    # ---- /initialpose 발행 ----
    reset_amcl_wait_sec: 5.0  # [s] /initialpose 구독자(AMCL)가 붙기를 기다리는 시간
    initial_cov_xy: 0.25      # [m^2] 보낼 위치 분산. 사람이 놓은 위치가 부정확하면 키운다
    initial_cov_yaw: 0.3      # [rad^2] 보낼 방향 분산. 놓은 방향이 크게 틀릴 수 있으면 키운다
    initialpose_repeat: 3     # 유실 대비 재발행 횟수
    # ---- 수렴 판정 ----
    max_cov_xy: 0.05          # [m^2] 이 이하여야 수렴
    max_cov_yaw: 0.1          # [rad^2]
    converge_timeout_sec: 5.0 # [s] 발행 후 수렴을 기다리는 시간
    # ---- 스캔 (수렴 못 하면 제자리에서 좌우로 돌고, 그래도 안 되면 한 바퀴. 회전량은 odom 으로 잰다) ----
    scan_angular_speed: 0.3   # [rad/s]
    scan_half_angle_rad: 1.5  # [rad] 좌우 스캔 한쪽 각도 (약 86도). 정면 -> 왼쪽 -> 오른쪽 -> 정면
    scan_full_turn_fallback: true  # 좌우 스캔이 실패하면 한 바퀴 스캔도 시도
    # ---- 스캔 안전 감시 (아래 경우는 정지하고 FAILED, 한 바퀴 fallback 없음) ----
    odom_topic: odom               # 회전량을 재는 오도메트리 (nav_msgs/Odometry)
    scan_angle_tolerance_rad: 0.05 # [rad] 목표 각도에 이만큼 가까워지면 도달로 본다. scan_half_angle_rad 보다 작아야 한다
    scan_odom_stale_sec: 1.0       # [s] odom 이 이 시간 이상 안 들어오면 정지
    scan_timeout_factor: 2.0       # 한 구간의 계획 시간(각도 / 속도)의 이 배수를 넘기면 정지 (바퀴 걸림 등)
