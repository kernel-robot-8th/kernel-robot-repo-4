# pinky3 순찰 노드 파라미터 (노드 이름 pinky_patrol_node)
# 위험구역 3개(A, B, C): zone_names / zone_points 와 points 의 Z<구역>_EXIT 로 구역마다 출구 좌표를 둔다.
# 실행: ros2 launch cobot_pinky_patrol pinky3_patrol.launch.xml
#   또는 ros2 run cobot_pinky_patrol pinky_patrol_node_pinky3 --ros-args --params-file <이 파일>
# 이 파일 없이 노드만 띄우면 필수 지점이 비어 시작이 거부된다 (조용히 기본 좌표로 움직이지 않음).
#
# 좌표는 map 좌표계, [x, y] 또는 [x, y, yaw]. x, y 는 m, yaw 는 rad.
# 값은 반드시 소수점 형태(0.0)로 쓴다. 정수(0)로 쓰면 파라미터 타입이 달라 시작이 거부된다.
pinky_patrol_node:
  ros__parameters:
    # zone_manager_node 의 robot_ids (cobot_zone_traffic_control/config/zone_params.yaml) 와 같아야 한다
    robot_id: pinky3
    # 마지막 명령을 마친 뒤 새 명령이 없을 때 홈으로 복귀하기까지의 시간(초). 0 이하이면 자동 복귀를 끈다
    idle_return_sec: 120.0
    # 유휴 복귀 시 돌아갈 지점 이름 (아래 points 안에 있어야 한다). pinky3 전용 홈 I3
    home_name: I3

    # ---- 위험구역 (구역마다 토큰·대기열이 따로: cobot_zone_traffic_control 의 zone_names 와 같아야 한다) ----
    zone_names: [A, B, C]
    # 구역별 소속 지점. 이 지점으로 가려면 그 구역의 토큰이 필요하고, 구역 안 -> 밖 이동 시 Z<구역>_EXIT 를 거친다.
    # 한 지점은 한 구역에만 속할 수 있고, 홈(home_name)은 구역 밖이어야 한다.
    # 확정(2026-10-27): 구역 A = ZA / 구역 B = ZB / 구역 C = ZC. 홈(I<n>)·일반 지점(P1, P2)은 구역 밖.
    zone_points:
      A: [ZA]
      B: [ZB]
      C: [ZC]
    points:
      # 초기 위치(홈) 지정 (2026-10-27 사용자): pinky1 (0, 0) / pinky2 (0, -0.2) / pinky3 (0, -0.4). 3대가 겹치지 않게 y 로 0.2 m 씩 띄움.
      I1: [0.0, 0.0, 0.0]         # pinky1 홈 (초기 위치, 사용 중)
      I2: [0.0, -0.2, 0.0]        # pinky2 홈 (참고용, pinky2.yaml 에서 사용)
      I3: [0.0, -0.4, 0.0]        # pinky3 홈 (참고용, pinky3.yaml 에서 사용)
      P1: [0.17, -0.6, 0.0]       # waypoint 실측 값
      P2: [0.45, -0.6, -1.5]      # waypoint 실측 값
      P3: [0.8, -1.0, 3.14]       # waypoint 실측 값
      P4: [0.2, -1.0, -1.5]       # waypoint 실측 값
      P5: [-0.25, -1.28, 3.14]    # waypoint 실측 값
      P6: [-0.25, -1.45, 0.0]     # waypoint 실측 값
      P7: [0.77, -1.45, 1.5]      # waypoint 실측 값
      P8: [0.95, -1.14, 1.5]      # waypoint 실측 값
      P9: [0.9, -0.65, 3.14]      # waypoint 실측 값
      P10: [0.17, -0.6, 0.0]      # waypoint 실측 값
      P11: [-1.13, -0.05, 1.5]    # waypoint 실측 값 
      P12: [-1.13, -0.25, 1.5]    # waypoint 실측 값 
      P13: [-0.9, -0.25, 1.5]     # waypoint 실측 값   
      P14: [-0.9, -0.45, 1.5]     # waypoint 실측 값   
      P15: [-0.90, -0.45, 1.5]    # waypoint 실측 값 
      P16: [-0.90, -0.65, 1.5]    # waypoint 실측 값 
      P17: [-0.70, -0.65, 1.5]    # waypoint 실측 값 
      P18: [-0.50, -0.65, 1.5]    # waypoint 실측 값 
      P19: [-0.30, -0.65, 1.5]    # waypoint 실측 값 
      P20: [-0.90, -0.80, 1.5]    # waypoint 실측 값 
      P21: [-0.70, -0.80, 1.5]    # waypoint 실측 값 
      P22: [-0.50, -0.80, 1.5]    # waypoint 실측 값 
      P23: [-0.30, -0.80, 1.5]    # waypoint 실측 값 
      P24: [-0.90, -1.00, 1.5]    # waypoint 실측 값 
      P25: [-0.70, -1.00, 1.5]    # waypoint 실측 값 
      P26: [-0.50, -1.00, 1.5]    # waypoint 실측 값 
      P27: [-0.30, -1.00, 1.5]    # waypoint 실측 값 
      P28: [-0.90, -1.20, 1.5]    # waypoint 실측 값 
      P29: [-0.70, -1.20, 1.5]    # waypoint 실측 값 
      P30: [-0.50, -1.20, 1.5]    # waypoint 실측 값 
      P31: [-0.30, -1.20, 1.5]    # waypoint 실측 값 
      P32: [-0.90, -1.40, 1.5]    # waypoint 실측 값 
      P33: [-0.70, -1.40, 1.5]    # waypoint 실측 값 
      P34: [-0.50, -1.40, 1.5]    # waypoint 실측 값 
      P35: [-0.30, -1.40, 1.5]    # waypoint 실측 값 
      P36: [0.0, 0.0, 0.0]        # Spare Waypoint
      P37: [0.0, 0.0, 0.0]        # Spare Waypoint
      P38: [0.0, 0.0, 0.0]        # Spare Waypoint
      P39: [0.0, 0.0, 0.0]        # Spare Waypoint
      P40: [0.0, 0.0, 0.0]        # Spare Waypoint
      P41: [0.0, 0.0, 0.0]        # Spare Waypoint
      P42: [0.0, 0.0, 0.0]        # Spare Waypoint
      P43: [0.0, 0.0, 0.0]        # Spare Waypoint
      P44: [0.0, 0.0, 0.0]        # Spare Waypoint
      P45: [0.0, 0.0, 0.0]        # Spare Waypoint
      P46: [0.0, 0.0, 0.0]        # Spare Waypoint
      P47: [0.0, 0.0, 0.0]        # Spare Waypoint
      P48: [0.0, 0.0, 0.0]        # Spare Waypoint
      P49: [0.0, 0.0, 0.0]        # Spare Waypoint
      P50: [0.0, 0.0, 0.0]        # Spare Waypoint
      ZA: [0.6, 0.5, -1.5]        # 구역 A 지점 (pinky1~3 동일)
      ZB: [0.6, -0.15, -1.5]      # 구역 B 지점 (pinky1~3 동일)
      ZC: [-0.5, 0.3, 1.5]        # 구역 C 지점 (pinky1~3 동일)
      # 일반 지점은 P1~P50 까지 쓴다 (사용자 실측 waypoint 값, pinky1~3 동일).
      # P11~P50 은 (0, 0, 0) 임시값이라 goto 하면 원점으로 간다. 실측 좌표로 교체하기 전에는 보내지 않는다.
      # 지점을 지우면(P51 이상 포함) goto 가 'unknown point' 로 거부한다.
      
      # ---- 구역 출구 ----
      # Z<구역>_EXIT: 구역을 나온 뒤 토큰을 반납하는 지점 (stop 후퇴 지점도 겸한다).
      # 대기 위치(앵커)·대기 슬롯 좌표는 로봇 YAML 에 두지 않는다 -> cobot_zone_traffic_control/config/zone_params.yaml 의
      # zone_<구역>.queue_anchor 가 유일한 출처이고, 매니저가 슬롯 좌표를 로봇에게 보내 준다 (2026-10-27).
      ZA_EXIT: [0.45, 0.2, -1.5]
      ZB_EXIT: [0.45, 0.45, -1.5]
      ZC_EXIT: [-0.2, -0.4, 1.5]

