# 현재 현장의 map 좌표(m, rad). 모든 로봇이 이 파일을 공유한다.
# 미등록 지점은 만들지 않는다. P36~P50의 예비 원점 좌표는 제거했다.
# 대기 앵커·슬롯은 zone_manager의 zone_params.yaml에서 관리한다.
pinky_patrol_node:
  ros__parameters:
    zone_names: [A, B, C]
    zone_points:
      A: [ZA]
      B: [ZB]
      C: [ZC]
