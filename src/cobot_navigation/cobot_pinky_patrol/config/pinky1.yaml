# pinky1 순찰 노드 파라미터 (노드 이름 pinky_patrol_node)
# 위험구역 3개(A, B, C): zone_names / zone_points 와 points 의 W<구역>/Z<구역>_EXIT 로 구역마다 좌표 한 쌍을 둔다.
# 실행: ros2 launch cobot_pinky_patrol pinky1_patrol.launch.xml
#   또는 ros2 run cobot_pinky_patrol pinky_patrol_node_pinky1 --ros-args --params-file <이 파일>
# 이 파일 없이 노드만 띄우면 필수 지점이 비어 시작이 거부된다 (조용히 기본 좌표로 움직이지 않음).
#
# 좌표는 map 좌표계, [x, y] 또는 [x, y, yaw]. x, y 는 m, yaw 는 rad.
# 값은 반드시 소수점 형태(0.0)로 쓴다. 정수(0)로 쓰면 파라미터 타입이 달라 시작이 거부된다.
pinky_patrol_node:
  ros__parameters:
    # zone_manager_node 의 robot_ids (cobot_zone_traffic_control/config/zone_params.yaml) 와 같아야 한다
    robot_id: pinky1
    # 마지막 명령을 마친 뒤 새 명령이 없을 때 홈으로 복귀하기까지의 시간(초). 0 이하이면 자동 복귀를 끈다
    idle_return_sec: 120.0
    # 유휴 복귀 시 돌아갈 지점 이름 (아래 points 안에 있어야 한다)
    home_name: I1

    # ---- 위험구역 (구역마다 토큰·대기열이 따로: cobot_zone_traffic_control 의 zone_names 와 같아야 한다) ----
    zone_names: [A, B, C]
    # 구역별 소속 지점. 이 지점으로 가려면 그 구역의 토큰이 필요하고, 구역 밖 <-> 안 이동 시 W/Z_EXIT 를 거친다.
    # 한 지점은 한 구역에만 속할 수 있고, 홈(home_name)은 구역 밖이어야 한다.
    # 확정(2026-10-27): 구역 A = ZA / 구역 B = ZB / 구역 C = ZC. 홈(I<n>)·일반 지점(P1, P2)은 구역 밖.
    zone_points:
      A: [ZA]
      B: [ZB]
      C: [ZC]
    points:
      # 초기 위치(홈) 지정 (2026-10-27 사용자): pinky1 (0, 0) / pinky2 (0, -0.2) / pinky3 (0, -0.4). 3대가 겹치지 않게 y 로 0.2 m 씩 띄움.
      I1: [0.0, 0.0, 0.0]      # pinky1 홈 (초기 위치, 사용 중)
      # I2: [0.0, -0.2, 0.0]      # pinky2 홈 (참고용, pinky2.yaml 에서 사용)
      # I3: [0.0, -0.4, 0.0]      # pinky3 홈 (참고용, pinky3.yaml 에서 사용)
      P1: [0.0, 0.0, 0.0]      # 일반 지점 (비어 있음, 실측 후 갱신. pinky1~3 동일)
      P2: [0.0, 0.0, 0.0]      # 일반 지점 (비어 있음, 실측 후 갱신. pinky1~3 동일)
      P3: [0.0, 0.0, 0.0]      # 일반 지점 (비어 있음, 실측 후 갱신. goto 하면 원점 (0,0) 으로 감)
      P4: [0.0, 0.0, 0.0]      # 일반 지점 (비어 있음, 실측 후 갱신. goto 하면 원점 (0,0) 으로 감)
      P5: [0.0, 0.0, 0.0]      # 일반 지점 (비어 있음, 실측 후 갱신. goto 하면 원점 (0,0) 으로 감)
      P6: [0.0, 0.0, 0.0]      # 일반 지점 (비어 있음, 실측 후 갱신. goto 하면 원점 (0,0) 으로 감)
      P7: [0.0, 0.0, 0.0]      # 일반 지점 (비어 있음, 실측 후 갱신. goto 하면 원점 (0,0) 으로 감)
      P8: [0.0, 0.0, 0.0]      # 일반 지점 (비어 있음, 실측 후 갱신. goto 하면 원점 (0,0) 으로 감)
      P9: [0.0, 0.0, 0.0]      # 일반 지점 (비어 있음, 실측 후 갱신. goto 하면 원점 (0,0) 으로 감)
      P10: [0.0, 0.0, 0.0]      # 일반 지점 (비어 있음, 실측 후 갱신. goto 하면 원점 (0,0) 으로 감)
      ZA: [0.6, 0.5, -1.5]      # 구역 A 지점 (pinky1~3 동일)
      ZB: [0.6, -0.15, -1.5]    # 구역 B 지점 (pinky1~3 동일)
      ZC: [-0.5, 0.3, 1.5]    # 구역 C 지점 (pinky1~3 동일)
      # 일반 지점은 P1~P10 까지 쓴다. 좌표를 모르는 P3~P10 은 (0,0,0) 자리표시자라 goto 하면 원점으로 간다 (실측 후 갱신).
      # 지점을 지우면(P11 이상 포함) goto 가 'unknown point' 로 거부한다.
      
      # ---- 구역 A (ZA) ----
      # W: 구역 A 토큰 요청·획득 지점 (대기열 슬롯 0).
      # 주의: cobot_zone_traffic_control/config/zone_params.yaml 의 zone_A.queue_anchor 와 같아야 한다.
      #       다르면 대기열 슬롯 좌표가 어긋난다 (테스트 test_zone_entry_matches_manager_anchor 가 검사).
      # Z_EXIT: 구역을 나온 뒤 토큰을 반납하는 지점 (stop 후퇴 지점도 겸한다).
      # 2026-10-27 사용자 지정 (구역 3개로 재편). A EXIT 는 이전 [0.4, -0.7, 0.0] 에서 변경.
      WA: [0.0, 0.6, 0.0]   # 2026-10-27: 대기 위치 (A·B 공유). yaw: 0.0 = 정면, -1.5 = 우측 90°, 1.5 = 좌측 90°
      ZA_EXIT: [0.5, 0.0, -1.5]

      # ---- 구역 B (ZB) ---- W(대기 위치)는 구역 A 와 같은 곳을 공유한다 (토큰·대기열은 구역별로 따로).
      # W 를 ZB 좌표와 같게 두면 대기자가 점유자 자리로 가므로 반드시 구역 지점과 분리한다.
      # W 는 zone_B.queue_anchor 와 같아야 한다.
      WB: [0.0, 0.6, -1.5]
      ZB_EXIT: [0.55, -0.6, -1.5]

      # ---- 구역 C (ZC) ---- W(대기 위치)는 ZC 와 분리 (2026-10-27 사용자 지정). W 는 zone_C.queue_anchor 와 같아야 한다.
      WC: [-0.7, -0.08, 1.5]
      ZC_EXIT: [-0.3, -0.4, 1.5]
