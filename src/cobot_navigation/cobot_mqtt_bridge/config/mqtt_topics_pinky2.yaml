# MQTT 브릿지 전용 토픽 목록 (pinky2). DDS 브릿지(cobot_domain_bridge)의 YAML 과는 별개다.
# 처음에는 DDS 쪽 pinky_bridge_pinky2.yaml 의 항목을 그대로 복사해 시작했고, 그 뒤로는 따로 관리한다.
# 여기를 고쳐도 DDS 브릿지에는 영향이 없고, DDS 쪽을 고쳐도 여기에는 자동으로 반영되지 않는다.
#
# 항목 쓰는 법
#   로봇 -> 관제(up):  키 = 로봇 쪽 이름,  from_domain: 10 / to_domain: 100,  remap = 관제 쪽 이름
#   관제 -> 로봇(down): 키 = 관제 쪽 이름, from_domain: 100 / to_domain: 10,  remap = 로봇 쪽 이름
#   remap 을 쓰지 않으면 양쪽 이름이 같다.
# 고친 뒤에는 PC 에서 colcon build 를 다시 하고, pinky2 에는 같은 파일을 다시 복사한 뒤 두 노드를 다시 시작한다.
# (README 의 "토픽 추가·리맵핑" 참고)

name: mqtt_topics_pinky2

topics:
  # 관제 PC(100) -> 핑키2(20)
  /pinky2/patrol_cmd:
    type: std_msgs/msg/String
    from_domain: 100
    to_domain: 20
    remap: /patrol_cmd

  /patrol_status:
    type: std_msgs/msg/String
    from_domain: 20
    to_domain: 100
    remap: /pinky2/patrol_status

  /pinky2/cmd_vel:
    type: geometry_msgs/msg/Twist
    from_domain: 100
    to_domain: 20
    remap: /cmd_vel

  /pinky2/initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 100
    to_domain: 20
    remap: /initialpose

  /pinky2/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 100
    to_domain: 20
    remap: /goal_pose

  # 핑키2(20) -> 관제 PC(100)
  /scan:
    type: sensor_msgs/msg/LaserScan
    from_domain: 20
    to_domain: 100
    remap: /pinky2/scan

  /odom:
    type: nav_msgs/msg/Odometry
    from_domain: 20
    to_domain: 100
    remap: /pinky2/odom

  /tf:
    type: tf2_msgs/msg/TFMessage
    from_domain: 20
    to_domain: 100
    remap: /pinky2/tf

  /tf_static:
    type: tf2_msgs/msg/TFMessage
    from_domain: 20
    to_domain: 100
    remap: /pinky2/tf_static

  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 20
    to_domain: 100
    remap: /pinky2/amcl_pose

  /battery_state:
    type: sensor_msgs/msg/BatteryState
    from_domain: 20
    to_domain: 100
    remap: /pinky2/battery_state

  # 로봇은 /battery_state 대신 Float32 두 개(/battery/percent, /battery/voltage)를 발행함.
  # 웹 GUI 백엔드가 이 두 토픽을 구독한다.
  /battery/percent:
    type: std_msgs/msg/Float32
    from_domain: 20
    to_domain: 100
    remap: /pinky2/battery/percent

  /battery/voltage:
    type: std_msgs/msg/Float32
    from_domain: 20
    to_domain: 100
    remap: /pinky2/battery/voltage

  # === ZONE-QUEUE ADDED ===================================================
  # zone_manager_node(대기열 슬롯 방식) 전용. 메시지에 robot_id 가 들어 있어 로봇별 remap 은 필요 없다.
  # status 는 매니저와 GUI 가 모두 관제 PC(100)에 있어 도메인을 건너갈 일이 없으므로 넣지 않는다.

  # 로봇(20) -> 관제 PC(100): 진입 요청 (대기 중 1초마다 재전송)
  /zone_manager/request_entry:
    type: std_msgs/msg/String
    from_domain: 20
    to_domain: 100

  # 로봇(20) -> 관제 PC(100): 구역 이탈 통보
  /zone_manager/notify_exit:
    type: std_msgs/msg/String
    from_domain: 20
    to_domain: 100

  # 로봇(20) -> 관제 PC(100): 대기 포기 (stop / 이동 실패 / queue_full)
  /zone_manager/cancel_entry:
    type: std_msgs/msg/String
    from_domain: 20
    to_domain: 100

  # 관제 PC(100) -> 로봇(20): 진입 허가
  /zone_manager/grant_entry:
    type: std_msgs/msg/String
    from_domain: 100
    to_domain: 20

  # 관제 PC(100) -> 로봇(20): 대기 슬롯 좌표 "robot_id:k:x,y,yaw" (k=-1 이면 대기열 가득 참)
  /zone_manager/queue_slot:
    type: std_msgs/msg/String
    from_domain: 100
    to_domain: 20
  # === ZONE-QUEUE END =====================================================
