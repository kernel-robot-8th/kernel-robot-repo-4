anomaly_monitor:
  ros__parameters:
    robot_ids: [pinky1, pinky2, pinky3]
    db_path: ~/.cobot/anomaly_monitor.sqlite3   # 관제 DB와 다른 파일
    cctv_control_mode: OBSERVE_ONLY             # AUTO_HOLD는 웹에서 켠다
    console_host: 127.0.0.1                     # fms-web-server에서 부르면 172.17.0.1
    console_port: 8083
    # 시뮬 어댑터와 같은 도메인에서 동시에 쓰지 않는다
    manual_adapter: true
    manual_targets: [vision, navigation, omx1, omx2, omx3]
    # 판정 없이 바로 성공으로 답할 대상(통신 연결용). anomaly_monitor.launch.xml 로 띄우면
    # launch 인자 auto_targets 가 이 값을 덮어쓴다(기본 ['']). 켜려면 auto_targets:='[vision, navigation]'
    auto_targets: ['']
    # 팀 팔 노드가 같은 도메인에 있으면 팔 대상은 그쪽에 맡긴다 (arm_station.launch.xml 의 노드 이름)
    peer_result_nodes: [arm_adapter, omx1_adapter, omx2_adapter, omx3_adapter]
    peer_targets: [omx1, omx2, omx3]
    allow_mock_events: false                    # 모의 이벤트 주입. 시뮬에서만 켠다
    console_commands: false                     # 콘솔 명령. 시뮬에서만 켠다
    camera_policy: field                        # field는 sim_ 카메라 거절, sim은 sim_만 수신
    event_topic: /anomaly_monitor/vision_event
