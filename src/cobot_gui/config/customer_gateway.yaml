# customer_gateway 노드 파라미터 (관제 PC). 설명: src/cobot_gui/docs/customer_app.md
customer_gateway:
  ros__parameters:
    # 핸드폰이 같은 Wi-Fi 에서 붙는다. 0.0.0.0 = 관제 PC 의 모든 네트워크 주소에서 받는다.
    host: "0.0.0.0"
    # 6000 은 크롬이 막는 포트(ERR_UNSAFE_PORT)라 쓰지 않는다.
    port: 8080
    # cobot_fleet_control 의 관제 토픽 (그 패키지의 config/fleet_control.yaml 과 같게 둔다)
    request_topic: /control_center/task_request
    events_topic: /control_center/task_events
    tasks_topic: /control_center/tasks
    # [s] fleet_control 응답을 기다리는 시간
    request_timeout_sec: 3.0
    # [s] 상태 스냅숏(1초 주기)이 이보다 오래되면 재고를 모르는 것으로 본다
    snapshot_stale_sec: 5.0
    # web_root, catalog_file 은 비워 두면 install 경로를 쓴다 (launch 에서 바꿀 수 있다).
