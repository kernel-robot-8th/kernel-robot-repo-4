# customer_gateway 노드 파라미터 (관제 PC). 설명: src/cobot_gui/docs/customer_app.md
customer_gateway:
  ros__parameters:
    # 핸드폰이 같은 Wi-Fi 에서 붙는다. 0.0.0.0 = 관제 PC 의 모든 네트워크 주소에서 받는다.
    host: "0.0.0.0"
    # 6000 은 크롬이 막는 포트(ERR_UNSAFE_PORT)라 쓰지 않는다.
    port: 8080
    # 게이트웨이 서명 키 파일 (fms_core 와 같은 키). 비면 서명 없이 보낸다 (개발 모드). 커밋하지 않는다.
    gateway_key_file: ""
    # [s] fms_core 서비스 응답을 기다리는 시간
    service_timeout_sec: 3.0
    # /control_center/orders 의 KEEP_LAST 깊이 (fms_core 와 같게)
    orders_qos_depth: 50
    # web_root, catalog_file 은 비워 두면 install 경로를 쓴다 (launch 에서 바꿀 수 있다).
    # layout_file(매장 배치)은 launch 가 cobot_bringup 경로를 넣는다.
