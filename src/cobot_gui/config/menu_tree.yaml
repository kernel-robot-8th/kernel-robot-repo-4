# FMS 관제 대시보드 메뉴 레지스트리 (정본)
#
# - 메뉴 목록의 정본은 이 파일이다. docs/fms_menu_tree.md 는 이 파일에서 생성한다.
# - 고친 뒤에는 레포 루트에서 생성기를 돌리고, 두 파일을 같은 PR 에 넣는다.
#     PYTHONPATH=src/cobot_gui python3 -m cobot_gui.gen_menu_doc
#     PYTHONPATH=src/cobot_gui python3 -m cobot_gui.gen_menu_doc --check   # 차이가 있으면 종료코드 1
# - 규칙은 docs/fms_dev_rules.md, 단계는 docs/fms_roadmap.md 를 본다.
#
# menus 항목 하나의 필드
#   id              메뉴 ID. 반드시 따옴표로 감싼다 ('1.1'). 따옴표가 없으면 YAML 이 숫자로 읽는다.
#   name            메뉴 이름. 메뉴 트리 원문 그대로 쓴다.
#   depth1          1Depth 대분류. 원문 그대로 쓴다. 앞 두 자리 = 메뉴 ID 앞자리.
#   screen          주 화면 ID (screens 의 id). 없앤(removed) 메뉴는 ''.
#   also_shown_in   (선택) 같은 메뉴가 함께 보이는 다른 화면 ID 목록.
#   phase           P1~P5 = 그 메뉴 작업이 처음 시작되는 단계. 뒤 단계 범위는 notes 에 적는다.
#                   없앤 메뉴는 removed.
#   status          planned | in_progress | done | removed
#   branch          (status 가 in_progress 일 때 필수) 작업 브랜치 이름. 선점 표시다.
#   sr              SR v5.0 의 ID 만 쓴다. 뜻을 바꾸지 않는다. 검사기는 sr_catalog 와
#                   menu_registry.py 의 고정 사본(SR_V5)에 대고 본다.
#   sr_unconfirmed  SR v5.0 에 없는 ID. 확인이 필요하다.
#   sr_original     (선택) 메뉴 트리 원문의 SR 매핑. 지금 매핑(sr + sr_unconfirmed)이 원문과
#                   다를 때만 적고, 이유는 notes 에 적는다. 생성 문서 표에 ✱ 로 보인다.
#   data_sources    읽는 데이터. 메시지·API 이름은 아키텍처 설계서 §3 의 제안 이름이다.
#                   인터페이스 PR(로드맵 S1) 전에는 확정이 아니다.
#   commands        이 메뉴가 보내는 명령. 없으면 [].
#   screen_owner    화면을 만드는 역할 키 (roles).
#   data_owner      데이터 계약(토픽·메시지)을 내는 역할 키. 원천이 여럿이면 주 원천 하나를 적고
#                   나머지는 notes 에 적는다. 모르면 '' 로 둔다 (경고 목록에 뜬다).
#   decisions       기다리는 결정 ID (decisions). 전체를 막는 결정(D1·D2·D8·D16·D21 등)은
#                   메뉴마다 적지 않는다. decisions 의 blocks 를 본다.
#   notes           메모 목록. '초안:' 으로 시작하는 줄은 판단이 들어간 값이다.
#
# phases 항목 하나의 필드
#   id              P1~P5. 순서대로 다섯 개다 (검사기가 본다).
#   title           단계 이름. docs/fms_roadmap.md 의 단계 제목과 같아야 한다 (시험이 본다).
#   roadmap_stage   로드맵 단계 번호 (S2~S6).
#
# decisions 항목 하나의 필드
#   id              D<숫자>.
#   title           무엇을 정하는가.
#   status          open (미결) | proposed (추천안이 있고 공지 전) | decided (공지했고 결정자·날짜를 적었다)
#                   decided 만 '정해졌다' 로 본다. 로드맵 출구 검사도 decided 만 통과로 친다.
#   blocks          이 결정을 기다리는 단계·화면.
#   proposal        (proposed·decided 일 때 필수) 추천안 또는 결정 내용 한 줄.
#   record          (proposed·decided 일 때 필수) 결정 기록 위치. 'docs/fms_decisions.md#d<숫자>' 꼴.
#   decided_by      (decided 일 때만, 필수) 결정자. 공지한 사람의 이름 또는 역할.
#   decided_on      (decided 일 때만, 필수) 결정일. 따옴표로 감싼 'YYYY-MM-DD'.
#                   따옴표가 없으면 YAML 이 날짜 객체로 읽어 검사기가 오류를 낸다.
#   decided 로 바꿀 때는 docs/fms_decisions.md 그 절의 상태·결정자·결정일도 같은 PR 에서 고친다
#   (시험이 둘을 대조한다).

schema_version: 1

source:
  menu_tree: 'FMS 관제 및 통합 대시보드 작업 세부 계획서 v0.1 — 메뉴 트리 (Confluence 6783015 v2, 2026-10-21)'
  screen_layout: 'FMS 관제 대시보드 아키텍처 설계서 v0.1 §5.1·§5.2·§7·§9·§10.1 (2026-10-22 초안, 팀 리뷰 전, 레포 밖 문서)'
  sr: 'System Requirements v5.0 (SR-01~21, 2026-10-19, Confluence 3801308)'
  roles: 'README.md 팀 구성 표, CLAUDE.md §2 담당 표 (main 913eb15)'

notes:
  - "초안: 메뉴 수는 34개로 센다. 원문 본문의 '33개' 는 3.7 을 넣기 전 숫자로 본다. 작성자 확인 전이다 (D17)."
  - '아키텍처 설계서 v0.1 은 아직 팀에 공개하지 않은 초안이다. 그래서 판단 근거는 설계서 절 번호 대신 각 메뉴 메모에 직접 적었다.'
  - '담당 칸(screen_owner, data_owner)은 모두 초안이다. README 팀 구성 표의 역할과 각 메뉴의 데이터 원천을 보고 채웠다. 각 역할 담당이 확인한다.'
  - 'screen_owner 는 규칙 R2(화면은 GUI 담당이 만든다)에 따라 활성 메뉴 모두 gui 로 두었다.'
  - '초안: 메뉴별 decisions 는 설계서 §10.1 의 막는 것 열에서 옮겼다. 각 결정이 막는 것은 생성 문서의 결정 목록 표에 있다.'
  - 'SR 매핑은 메뉴 트리 원문 대조표를 따랐다. 원문과 다른 메뉴는 sr_original 에 원문 값을 두고 메모에 이유를 적었다. UR ID 는 sr 에 넣지 않는다.'
  - '패키지 접두사 `cobot_` 는 main 의 폴더 이름(`cobot_navigation`, `cobot_vision`)을 따랐다. README 의 `<proj>_` 는 자리표시자다. 확정은 D1.'
  - '역할의 packages 는 CLAUDE.md §2 의 `<proj>_` 를 `cobot_` 로 바꾼 예정 이름이다. main 913eb15 에는 cobot_navigation·cobot_vision 폴더만 있고, 나머지 패키지는 아직 없다.'

