decisions:
  # S1(P0) 결정 6건(D1~D5, D8)은 추천안이 있는 proposed 다. 기록은 docs/fms_decisions.md.
  - id: D1
    status: proposed
    title: '인터페이스 패키지 — fleet_msgs(미병합 브랜치 feature/setup-fleet-msgs-structure)를 cobot_interfaces 로 옮겨 확장할지, 접두사를 `cobot_` 로 할지'
    blocks: 'S1(P0) 이후 전부'
    proposal: 'fleet_msgs 를 cobot_interfaces 로 옮겨 확장한다. 접두사는 cobot_ 로 한다. team11 pinky_fleet_msgs(Apache-2.0) 원저작 표기를 복원한다.'
    record: 'docs/fms_decisions.md#d1'
  - id: D2
    status: proposed
    title: 'ROS_DOMAIN_ID — README 100 vs SR-19 10/12, 두 도메인의 교차점, 개발용 도메인 값'
    blocks: '모든 노드 발견'
    proposal: 'SR-19 그대로 10 = 실물 구동, 12 = Nav2. 두 도메인의 교차점은 핑키 온보드 가드 하나(두 rclpy Context, S1 스파이크로 확인). README 의 100 은 개발·시뮬 전용.'
    record: 'docs/fms_decisions.md#d2'
  - id: D3
    status: proposed
    title: '맵 정본, map_hash 입력 정의, 접근 자세, 맵 파일 위치'
    blocks: '미션, 펜싱, ② 지도'
    proposal: '정본 = map_shoe_store_flat, 위치 = src/cobot_bringup/config/maps/, map_hash = sha256(sha256(pgm) ‖ sha256(LF 정규화 yaml)) 이고 입력은 install 된 파일, 작업점(work_pose)과 Nav2 정차점(approach_pose)을 나눈다. approach_pose 값과 맵 린트 반경 6 cm 는 초안.'
    record: 'docs/fms_decisions.md#d3'
  - id: D4
    status: proposed
    title: '정지 계열 펜싱 예외, 통신 순단 복구의 무게'
    blocks: 'P2 가드 구현'
    proposal: '정지 계열은 펜싱 판정이 거부여도 수행하고 워치독은 갱신하지 않는다. 통신 순단 복구는 SR-20 대로 epoch+1·DISARMED.'
    record: 'docs/fms_decisions.md#d4'
  - id: D5
    status: proposed
    title: 'SR-14 관제사 2단계 승인의 독립 요소'
    blocks: '⑤ 복구'
    proposal: 'Reconcile 항목별 확인 입력(attest) + APPROVE 뒤 최소 체류(초안 5 s). 2인 승인·비밀번호 재입력은 설정으로 고른다.'
    record: 'docs/fms_decisions.md#d5'
  - {id: D6, status: open, title: 'HW E-STOP 판독 장치·배선·구역, 모터 전원 증거, 미설치 때 RUNNING 허용, 물리 완료 센서원', blocks: 'P2 HW 축, SR-10·13·21'}
  - {id: D7, status: open, title: 'PRD_3 OMX 상·하차를 수업 로컬 게이트(사람 수동 시작, 원격 트리거 없음) 대상으로 볼지', blocks: 'P4, 3.5, SR-09 시연 흐름'}
  - id: D8
    status: proposed
    title: '정적 웹 자원 패키지 형태(CLAUDE.md §3 에 없음), vendoring·fastapi·uvicorn 의존성 허락'
    blocks: 'P1 빌드 (화면 셸 위치)'
    proposal: '2안: cobot_gui(ament_python) 의 web/ 폴더를 setup.py data_files 로 설치하고 CLAUDE.md §3 에 web/ 규칙을 더한다. fastapi·uvicorn·JS vendoring 허락은 S2 착수 전에 따로 정한다(D8 후속).'
    record: 'docs/fms_decisions.md#d8'
  - {id: D9, status: open, title: '역할 권한표 — 직원 정지 허용, 주문 취소 범위, 고객 화면 범위, 콘솔 만료 때 처리', blocks: 'P1 로그인, P2'}
  - {id: D10, status: open, title: '카메라 구성, 폰 송출 수단, 제어용 영상 입력 경로, 캡처 시각 전달, Ttop 팬아웃', blocks: '④, P1 영상, P3 Tail Exit, P4 LeRobot 모드'}
  - {id: D11, status: open, title: '하트비트 주기·ttl, 시계 허용 오프셋, 승인 만료·최소 체류·WS 끊김 시간 값', blocks: 'P2'}
  - {id: D12, status: open, title: '3.3·3.4 데이터 전달 수단, PT-23 공식 녹화 도구', blocks: 'P4'}
  - {id: D13, status: open, title: '서명 키의 생성·배포·교체 방법', blocks: 'P2'}
  - {id: D14, status: open, title: '주문 상태 열거, 메뉴 트리에 주문 호출·재고·회수 화면 추가', blocks: 'P3'}
  - {id: D15, status: open, title: '원장·로그 보존 기간과 백업, 영상 사람 촬영·보존·삭제 정책', blocks: 'P5, 4.4·4.5'}
  - {id: D16, status: open, title: 'Git 규칙 단일화, main 보호, CODEOWNERS', blocks: '모든 PR'}
  - {id: D17, status: open, title: "6.5 'SR-22' 의 정체, 메뉴 문서 정정(33 → 34, 3.7)", blocks: '문서 정합'}
