# 고객 주문 화면(보조 A)의 신발 목록과 자리 목록. sub PC 의 customer_gateway 가 읽는다.
# 설명: src/cobot_gui/docs/customer_app.md
#
# locations: 자리 QR 의 위치 ID. QR 주소는 http://<sub PC IP>:8080/?loc=<위치 ID>
#   fms_core 의 config/order_manager.yaml 의 locations 와 ID 를 맞춘다 (거기서 웨이포인트로 바꾼다).
# items: sku 는 fms_core 재고(initial_inventory)의 SKU 와 맞춘다. price 는 [원].
#   image 는 web/public/customer/shoes/ 아래 파일 이름 (비면 그림 대신 아이콘). 장당 100 KB 이하로 줄여 넣는다.
#   지금 목록은 자리 채움 예시다. 실제 신발 예시를 받으면 바꾼다.
