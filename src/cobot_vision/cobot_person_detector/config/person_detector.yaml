# YOLO 사람 인식 노드 파라미터 (핑키와 연결된 PC 에서 실행)
person_detector_node:
  ros__parameters:
    model_path: ''                    # YOLO .pt 경로 (launch 인자 model_path 로 지정)
    image_topic: camera/image_raw     # 카메라 토픽. 브릿지를 거치면 /pinkyN/... 로 지정
    use_compressed: false             # true 면 sensor_msgs/CompressedImage 구독
    output_topic: person_detections   # vision_msgs/Detection2DArray
    person_class: 0                   # 모델의 사람 클래스 번호
    min_confidence: 0.5
    min_box_height: 20.0              # [px]
    imgsz: 640
    device: cpu                       # GPU 가 있으면 '0'
    max_rate: 5.0                     # [Hz]
