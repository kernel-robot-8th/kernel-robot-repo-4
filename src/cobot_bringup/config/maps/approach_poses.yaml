# 웨이포인트 작업점(work_pose)과 Nav2 정차점(approach_pose) — 초안
#
# - 상태: 초안 (2026-10-22). 결정 D3 는 아직 proposed 다. approach_pose 값은 주행 담당 확인이 필요하다.
# - 맵 정본: 같은 폴더의 map_shoe_store_1021_gate67.yaml 과 map_shoe_store_1021_gate67.pgm.
#   Floor Map 1021 도면 + 아래 벽에 붙은 67 cm 게이트다 (사용자 결정 2026-10-22).
#   만든 방법은 docs/fms_map_contract.md 2절. 맵을 바꾸는 절차는 같은 문서의 '맵을 바꾸는 절차' 를 따른다.
# - 좌표: map frame, [x (m), y (m), theta (도)]. 맵 YAML 의 waypoints 와 같은 형식이다.
#   work_pose     = 원래 웨이포인트 좌표. 맵 YAML 의 waypoints 와 같아야 한다 (map_lint 가 본다).
#                   팔이 일하는 자리라 탁자 위(점유 셀)일 수 있다.
#   approach_pose = 핑키가 Nav2 로 멈추는 자리. 반경 clearance_radius_m 원 안 셀이 모두 자유여야 한다.
# - 검사 (레포 루트에서):
#     PYTHONPATH=src/cobot_control_center python3 -m cobot_control_center.map_contract lint
#
# 필드
#   schema_version      이 파일 형식 번호 (1).
#   status              draft | confirmed. 주행 담당이 approach_pose 를 확인하면 confirmed.
#   map.yaml            맵 YAML 파일 이름 (같은 폴더). 경로는 쓰지 않는다.
#   map.pgm_sha256      PGM 바이트의 sha256.
#   map.yaml_lf_sha256  맵 YAML 을 LF 로 맞춘 바이트의 sha256.
#   map.map_hash        sha256( sha256(PGM) ‖ sha256(LF 맞춘 YAML) ). 맵을 바꾸면 셋 다 다시 계산한다.
#   clearance_radius_m  린트 반경 [m]. 초안 값 (아키텍처 설계서 §9.1 의 6 cm). 핑키 외형 실측이 아니다.
#   waypoints.<ID>      work_pose, approach_pose, arm_id(선택), note(선택).
#   arm_id              이 지점에서 일하는 팔 (omx_1~omx_3, 인터페이스 계약의 이름). 팔이 없는 지점은 적지 않는다.
#                       초안: 도면의 팔 표식 OMX_1/2/3 바로 옆 웨이포인트에 붙였다. fms_core 가
#                       MapInfo.waypoints[].arm_id 를 채울 때 이 값을 쓴다 (출발 게이트, S2). 다른 곳에 따로 적지 않는다.
