# 매장 배치 (보조 A 고객 주문). 팀 공통 설정이라 cobot_bringup 에 둔다 (CLAUDE.md §3-5).
# 관제 PC 에서 order_manager(cobot_control_center)와 customer_gateway(cobot_gui)가 같이 읽는다.
# 두 노드는 launch 파라미터 layout_file 로 이 파일 경로만 받는다 (패키지끼리 import 하지 않는다, §3-6).
# 설명: src/cobot_control_center/docs/order_flow.md 의 '매장 배치' 절
#
# 바뀌지 않는 배치(선반 모양, 자리 QR)만 둔다. 어느 칸에 어떤 신발이 몇 개 있는지는 DB(inventory)에 있다.
# 웨이포인트 좌표는 맵 계약(docs/fms_map_contract.md)을 따른다. 정차점은 주행 담당 확인 필요.

shelf:
  # 선반 행 수. 행은 팔(OMX)이 집는 높이다. 1행이 위인지 아래인지는 팔 담당과 정한다.
  rows: 3
  # 열 번호 -> 핑키가 정차할 웨이포인트. 핑키는 신발이 있는 열 앞으로 간다.
  # WP_SHELF_C1~C3 은 아직 맵 YAML 과 approach_poses.yaml 에 없다 (주행 담당이 넣어야 한다).
  columns:
    1: WP_SHELF_C1
    2: WP_SHELF_C2
    3: WP_SHELF_C3

# 자리 QR 의 위치 ID. QR 주소는 http://<관제 PC IP>:8080/?loc=<위치 ID>
# 자리를 늘리면 여기에만 한 줄 더하고 QR 을 인쇄한다.
locations:
  BENCH_1:
    name: "고객 벤치 1"
    waypoint: WP_BENCH_DELIVERY
