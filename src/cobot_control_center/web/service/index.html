  서비스 관리화면 (매장 직원용). 주문 중심으로 보고 기본 조치만 한다.
  데이터: GET /api/service (주문·재고·보류), /api/fleet (로봇), /api/arms (로봇팔).
  조치: 기존 명령 경로 (/api/commands/arm·estop, /api/orders/{id}/recover·confirm_loaded,
  /api/robots/{id}/stop·release_control). 개발·시험 기능은 엔지니어 화면(/)에 있다.
  외부 CDN 을 쓰지 않는다 (현장은 인터넷이 없다).
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>매장 운영 화면</title>
  <link rel="stylesheet" href="service.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>매장 운영</h1>
      <span id="mode-chip" class="chip">연결 중…</span>
    </div>
    <div class="links">
      <span class="link-state"><i id="dot-backend" class="dot"></i>관제</span>
      <span class="link-state"><i id="dot-controller" class="dot"></i>주문 처리기</span>
      <span id="clock" class="clock"></span>
    </div>
    <div class="top-actions">
      <button id="arm-toggle" class="btn" type="button" disabled>주문 처리 …</button>
      <button id="estop-all" class="btn btn-estop" type="button" disabled>전체 비상정지</button>
    </div>
  </header>

  <div id="alerts" class="alerts" hidden></div>

  <main class="layout">
    <section class="panel orders-panel">
      <div class="panel-head">
        <h2>진행 중 주문 <span id="active-count" class="count">0</span></h2>
      </div>
      <div id="active-orders" class="order-list"></div>
      <p id="active-empty" class="empty">진행 중인 주문이 없습니다.</p>
    </section>

    <aside class="side">
      <section class="panel">
        <h2>로봇</h2>
        <div id="robots" class="mini-list"></div>
        <p id="robots-empty" class="empty" hidden>로봇 정보를 아직 받지 못했습니다.</p>
      </section>
      <section class="panel">
        <h2>로봇팔</h2>
        <div id="arms" class="mini-list"></div>
        <p id="arms-empty" class="empty" hidden>로봇팔 정보가 없습니다.</p>
      </section>
      <section class="panel">
        <h2>재고</h2>
        <table class="stock">
          <thead><tr><th>상품</th><th>선반</th><th class="num">남은 수량</th></tr></thead>
          <tbody id="stock"></tbody>
        </table>
        <p id="stock-empty" class="empty" hidden>재고 정보가 없습니다.</p>
      </section>
    </aside>

    <section class="panel finished-panel">
      <div class="panel-head">
        <h2>끝난 주문</h2>
        <span id="finished-summary" class="summary"></span>
      </div>
      <table class="finished">
        <thead>
          <tr><th>시각</th><th>주문</th><th>상품</th><th>자리</th><th>로봇</th><th>결과</th><th>걸린 시간</th></tr>
        </thead>
        <tbody id="finished"></tbody>
      </table>
      <p id="finished-empty" class="empty">끝난 주문이 없습니다.</p>
    </section>
  </main>

  <footer class="foot">
    <a href="/">엔지니어 화면</a>
    <span>문제가 계속되면 엔지니어에게 알려 주세요.</span>
  </footer>

  <dialog id="dialog" class="dialog">
    <form method="dialog" id="dialog-form">
      <h3 id="dialog-title"></h3>
      <div id="dialog-lines" class="dialog-lines"></div>
      <div id="dialog-checks" class="dialog-checks"></div>
      <label class="dialog-operator">처리한 사람
        <input id="dialog-operator" type="text" autocomplete="name" placeholder="이름">
      </label>
      <div id="dialog-actions" class="dialog-actions"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="service.js"></script>
</body>
</html>
