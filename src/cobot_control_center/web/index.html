  관제 화면. fleet_api_node 가 이 폴더를 / 로 서빙한다.
  명령 버튼은 /api/tasks 로만 요청한다 (로봇 토픽을 직접 만지지 않음).
  외부 라이브러리·CDN 없이 동작한다 (현장은 인터넷이 없을 수 있다).
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로봇 관제</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1>로봇 관제</h1>
      <span class="mode" id="mode" data-mode="unknown">도메인 ?</span>
    </div>
    <div class="links">
      <span class="link" id="link-ws" data-state="bad"><i></i>백엔드</span>
      <span class="link" id="link-source" data-state="bad"><i></i>관제 노드</span>
      <span class="link" id="link-tasks" data-state="bad" title="task_manager_node (명령)"><i></i>작업 노드</span>
      <span class="link" id="link-zone" data-state="na"><i></i><span class="label">zone_manager</span></span>
      <span class="link bridges" id="link-bridges"><span class="label">브릿지</span></span>
      <span class="updated" id="updated">수신 대기</span>
    </div>
  </header>

  <ul class="alerts" id="alerts" aria-label="경고" hidden></ul>

  <main class="layout">
    <!-- 지도와 이벤트를 한 칸에 두어 스크롤 없이 함께 보이게 한다 -->
    <div class="main-col">
    <section class="panel map-panel" aria-label="지도">
      <div class="panel-head">
        <h2>지도</h2>
        <span class="muted" id="map-meta"></span>
      </div>
      <div class="map-wrap" id="map-wrap">
        <canvas id="map"></canvas>
        <p class="map-empty" id="map-empty" hidden>지도 없음</p>
      </div>
      <div class="legend muted" id="map-legend" hidden>
        <label class="toggle"><input type="checkbox" id="show-layers" checked>구역 표시</label>
        <label class="toggle"><input type="checkbox" id="show-points" checked>웨이포인트</label>
        <span><i class="lg-zone"></i>구역 지점 (초록 비어 있음 · 주황 점유)</span>
        <span><i class="lg-exit">×</i>구역 출구</span>
        <span><i class="lg-queue"></i>대기 슬롯 (A0 = 맨 앞)</span>
        <span><i class="lg-home"></i>홈</span>
        <span class="lg-points-item"><i class="lg-point"></i>웨이포인트 P (화살표 = 도착 방향)<em id="points-hidden"></em></span>
      </div>
    </section>

    <section class="panel events-panel" id="events-panel" aria-label="이벤트">
      <div class="panel-head">
        <h2>이벤트</h2>
        <label class="muted">로봇
          <select id="event-robot"><option value="">전체</option></select>
        </label>
      </div>
      <ol class="events" id="events"><li class="muted">이벤트 없음</li></ol>
    </section>
    </div>

    <aside class="side">
      <section class="panel" aria-label="로봇">
        <div class="panel-head"><h2>로봇</h2></div>
        <div class="cards" id="cards"></div>
      </section>

      <section class="panel" aria-label="작업">
        <div class="panel-head"><h2>작업</h2><span class="muted" id="tasks-meta"></span></div>
        <p class="cmd-msg" id="cmd-msg" hidden></p>
        <ol class="tasks" id="tasks"><li class="muted">작업 없음</li></ol>
      </section>

      <section class="panel" aria-label="위험구역">
        <div class="panel-head"><h2>위험구역</h2></div>
        <div class="zones" id="zones"><p class="muted">구역 상태 수신 대기</p></div>
      </section>
    </aside>
  </main>

  <template id="card-template">
    <article class="card">
      <div class="card-top">
        <span class="swatch"></span>
        <strong class="name"></strong>
        <span class="badge"></span>
      </div>
      <div class="state-row">
        <span class="state"></span>
        <span class="detail muted"></span>
      </div>
      <div class="battery" title="배터리">
        <div class="battery-bar"><div class="battery-fill"></div></div>
        <span class="battery-text"></span>
      </div>
      <div class="meta muted"></div>
      <div class="topics muted" title="토픽별로 마지막으로 받은 뒤 지난 시간. 위치(amcl)는 로봇이 멈춰 있으면 새로 오지 않는 게 정상"></div>
      <div class="card-actions">
        <span class="teach-warn"></span>
        <button type="button" class="teach-btn"
                title="지금 위치 [x, y, yaw] 를 클립보드에 넣는다 (파일은 고치지 않음)">위치 복사</button>
      </div>
      <code class="teach-line" hidden></code>
      <div class="cmd-row">
        <button type="button" data-cmd="goto">이동</button>
        <button type="button" data-cmd="zone">구역</button>
        <button type="button" data-cmd="leave">나가기</button>
        <button type="button" data-cmd="home">홈</button>
        <button type="button" class="stop-btn" data-cmd="stop" title="지금 작업 중단 (구역 안이면 출구로 나와 반납)">정지</button>
        <button type="button" class="stop-btn" data-cmd="emergency_stop"
                title="그 자리 정지, 구역 토큰 유지 (zone_manager 가 max_hold_sec 뒤 해제)">비상정지</button>
      </div>
      <div class="cmd-task muted"></div>
    </article>
  </template>

  <template id="task-template">
    <li class="task">
      <div class="task-top">
        <strong class="task-robot"></strong>
        <span class="task-command"></span>
        <span class="task-state"></span>
      </div>
      <div class="task-detail muted"></div>
      <div class="task-meta muted"></div>
      <button type="button" class="resolve-btn" hidden>현장 확인 후 해제</button>
    </li>
  </template>

  <dialog id="cmd-dialog">
    <form method="dialog" class="cmd-form">
      <h3 id="cmd-title"></h3>
      <div class="cmd-pick" id="cmd-pick"></div>
      <p class="cmd-route" id="cmd-route"></p>
      <p class="cmd-warn" id="cmd-warn"></p>
      <div class="cmd-buttons">
        <button type="button" id="cmd-clear">지우기</button>
        <button value="cancel">취소</button>
        <button value="ok" id="cmd-ok" class="primary">보내기</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
