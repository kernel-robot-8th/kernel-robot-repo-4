# order_manager 노드 파라미터 (fms_core 주문 부분, 보조 A 고객 주문). 관제 PC 에서 쓴다.
# 설명: src/cobot_control_center/docs/order_flow.md
order_manager:
  ros__parameters:
    # 주문 DB (SQLite). 재시작해도 주문이 남는다. 지우면 재고를 initial_inventory 로 다시 채운다.
    db_path: "~/.ros/cobot_orders.sqlite3"
    # 게이트웨이 서명 키 파일. 비면 서명을 검사하지 않는다 (개발 모드). 키 파일은 커밋하지 않는다.
    gateway_key_file: ""
    # 자리 QR 의 위치 ID = 배송 웨이포인트. 자리를 늘리면 한 줄 더하고 QR 을 인쇄한다.
    # 웨이포인트 좌표는 맵 계약(docs/fms_map_contract.md)을 따른다. 정차점은 주행 담당 확인 필요.
    locations:
      - "BENCH_1=WP_BENCH_DELIVERY"
    # 배정 후보 핑키. 지금은 실제 배정 규칙(SR-03) 없이 돌아가며 고른다.
    robot_ids: ["pinky_1", "pinky_2", "pinky_3"]
    # 초기 재고 "SKU:보관위치:수량". DB 재고가 비어 있을 때만 넣는다 (D19 전 초안).
    initial_inventory:
      - "SHOE_RUN_WHITE_260:RACK_A:3"
      - "SHOE_SNEAKER_BLACK_270:RACK_A:3"
      - "SHOE_BOOT_BROWN_250:RACK_B:2"
      - "SHOE_SANDAL_BEIGE_240:RACK_B:2"
    # [s] 로봇 단계 하나가 걸리는 시간 (시뮬레이션). 팔·주행과 연결되면 쓰지 않는다.
    sim_step_sec: 3.0
    # [s] 단계 진행을 확인하는 주기
    tick_period_sec: 0.5
    # /control_center/orders 의 KEEP_LAST 깊이. 늦게 붙은 게이트웨이가 최근 주문을 받는다.
    orders_qos_depth: 50
    # 취소 뒤 정돈·재상차하는 자리 (OMX_3)와 돌아갈 창고
    repack_waypoint: "WP_UNLOAD"
    warehouse_waypoint: "WP_LOAD_1"
    home_waypoint: "WP_HOME_1"
