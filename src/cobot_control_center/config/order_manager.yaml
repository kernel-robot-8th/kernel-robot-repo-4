# order_manager 노드 파라미터 (fms_core 주문 부분, 보조 A 고객 주문). 관제 PC 에서 쓴다 (고객 게이트웨이도 같은 PC).
# 설명: src/cobot_control_center/docs/order_flow.md
order_manager:
  ros__parameters:
    # 주문 DB (SQLite). 재시작해도 주문이 남는다. 지우면 재고를 initial_inventory 로 다시 채운다.
    db_path: "~/.ros/cobot_orders.sqlite3"
    # 게이트웨이 서명 키 파일. 비면 서명을 검사하지 않는다 (개발 모드). 키 파일은 커밋하지 않는다.
    gateway_key_file: ""
    # 매장 배치(선반 행·열 -> 웨이포인트, 자리 QR)는 cobot_bringup/config/store_layout.yaml 에 있다.
    # 경로는 launch 가 layout_file 로 넣는다 (customer_gateway 와 같은 파일).
    # 배정 후보 핑키. 지금은 실제 배정 규칙(SR-03) 없이 돌아가며 고른다.
    robot_ids: ["pinky_1", "pinky_2", "pinky_3"]
    # 초기 재고 "SKU:행:열:수량". 칸은 store_layout.yaml 의 선반 안이어야 하고 한 칸에 SKU 하나다.
    # DB 재고가 비어 있을 때만 넣는다 (D19 전 초안). 지금 배치는 예시다.
    initial_inventory:
      - "SHOE_RUN_WHITE_260:1:1:3"
      - "SHOE_SNEAKER_BLACK_270:1:2:3"
      - "SHOE_BOOT_BROWN_250:2:1:2"
      - "SHOE_SANDAL_BEIGE_240:2:3:2"
    # [s] 로봇 단계 하나가 걸리는 시간 (시뮬레이션). 팔·주행과 연결되면 쓰지 않는다.
    sim_step_sec: 3.0
    # [s] 단계 진행을 확인하는 주기
    tick_period_sec: 0.5
    # /control_center/orders 의 KEEP_LAST 깊이. 늦게 붙은 게이트웨이가 최근 주문을 받는다.
    orders_qos_depth: 50
    # 취소 뒤 정돈·재상차하는 자리 (OMX_3). 그 뒤 핑키는 그 신발의 선반 열 앞으로 돌아간다.
    repack_waypoint: "WP_UNLOAD"
    home_waypoint: "WP_HOME_1"
