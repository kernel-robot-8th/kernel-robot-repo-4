# 관제 백엔드 파라미터 (관제 PC, ROS_DOMAIN_ID=100)
# 노드 이름과 상관없이 적용 (개발용 fleet_api_node_dev 도 같은 파일을 쓴다)
/**:
  ros__parameters:
    host: 127.0.0.1           # 이 PC 에서만 접속. 다른 PC 에서 보려면 launch 인자 host:=0.0.0.0 (로그인 기능 없음 주의)
    port: 8080
    source_stale_sec: 3.0     # fleet_status 가 이만큼 끊기면 source_online=false [s]
    map_yaml: ''              # 지도 YAML 경로. fleet_api.launch.xml 의 map_yaml 인자가 채운다. 비면 지도 없이
    web_dir: ''               # 화면 정적 파일 폴더. 비면 share/cobot_control_center/web
    points_dir: ''            # 순찰 설정 pinkyN.yaml 폴더 (구역 지점·출구·홈). fleet_api.launch.xml 이 채운다
    zone_params: ''           # zone_manager 설정 (로봇 목록·대기 슬롯). fleet_api.launch.xml 이 채운다. 둘 중 하나라도 비면 구역 표시 없이
    events_max: 500           # 이벤트 로그 보관 개수 (메모리, 백엔드를 다시 켜면 지워짐)
    task_stale_sec: 3.0       # 작업 노드(fleet_control_node)의 작업 목록이 이만큼 끊기면 명령을 받지 않음 [s]
    reply_timeout_sec: 2.0    # 명령 요청에 작업 노드가 답하기를 기다리는 시간 [s]. 넘으면 503
    # 카메라 영상 (sensor_msgs/CompressedImage, JPEG). 받은 JPEG 를 그대로 화면에 넘긴다.
    # 토픽 이름은 가정값이다 (비전 브랜치 592ebd4 규격 + 로봇별 접두사). 확정되면 여기만 고친다.
    # 실물은 cobot_domain_bridge 에 카메라 토픽이 있어야 들어온다 (아직 없음 → 화면에 '영상 없음').
    camera_robots: [pinky1, pinky2, pinky3]   # 구독할 로봇. [''] 이면 끔
    camera_topic_format: /{robot}/camera/image_raw/compressed
    read_only: false          # true 면 명령 경로 503, task_request 를 내지 않음. fleet_api_dev.launch.xml 이 켠다
