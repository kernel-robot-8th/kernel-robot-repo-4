# 읽기 전용 관제 노드 파라미터 (관제 PC, ROS_DOMAIN_ID=100)
fleet_status_node:
  ros__parameters:
    robots: [pinky1, pinky2, pinky3]   # 관제 PC 쪽 토픽 접두사 (/pinkyN/...)
    stale_timeout_sec: 3.0             # 위치·배터리가 이만큼 끊기면 offline [s]
    publish_period_sec: 1.0            # /control_center/fleet_status 발행 주기 [s]
    control_domain_id: 100             # 실물 관제 도메인. 이 도메인일 때만 브릿지·zone_manager 를 검사
    # 관제 PC 쪽 브릿지 노드 이름. cobot_domain_bridge 설정의 name 에 도메인이 붙은 모양
    bridge_node_format: pinky_bridge_{robot}_only_{domain}
    mock_node_name: mock_pinky_node    # 이 노드가 보이면 '가짜 핑키' 모드로 표시
    # '위치 복사'(웨이포인트 티칭) 경고 기준. amcl 공분산의 표준편차가 넘으면 경고만 한다 (막지 않음).
    # TODO(실측): 처음 값은 임시. 로봇을 세워 둔 평소 값을 재서 정한다.
    teach_max_std_xy: 0.05             # 위치 [m]
    teach_max_std_yaw: 0.1             # 방향 [rad]
    # 경고 기준 (화면 상단 배너와 이벤트 로그). TODO(실측): 처음 값은 임시.
    battery_warn_percent: 20.0         # 이 값 이하면 배터리 경고 [%]
    stuck_sec: 15.0                    # 이동 중 state 인데 이만큼 거의 제자리면 끼임 의심 [s]
    stuck_distance_m: 0.05             # '거의 제자리' 기준 거리 [m]
    zone_hold_warn_sec: 200.0          # 구역을 이만큼 점유하면 경고 [s] (zone_manager max_hold_sec 240 보다 먼저)
    queue_stale_sec: 2.5               # 대기 슬롯 알림(zone_manager 가 1초마다 다시 냄)이 이만큼 안 오면 대기열을 떠난 것으로 [s]
