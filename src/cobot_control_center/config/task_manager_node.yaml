# 관제 작업 노드 파라미터 (관제 PC). 로봇 명령 토픽(/pinkyN/patrol_cmd)에 발행한다
task_manager_node:
  ros__parameters:
    robots: [pinky1, pinky2, pinky3]   # 관제 PC 쪽 토픽 접두사 (/pinkyN/...)
    db_path: ~/.ros/cobot_control_center/tasks.db   # 작업·사건 기록 (SQLite). 가짜 핑키는 다른 파일
    points_dir: ''                     # 순찰 설정 pinkyN.yaml 폴더 (지점 검사). task_manager.launch.xml 이 채운다
    ack_timeout_sec: 3.0               # 보낸 뒤 이 안에 시작 응답이 없으면 UNKNOWN [s]. TODO(실측)
    task_timeout_sec: 300.0            # 시작 뒤 이 안에 끝나지 않으면 UNKNOWN [s]. TODO(실측)
    fleet_stale_sec: 3.0               # fleet_status 가 이만큼 끊기면 새 작업을 받지 않음 [s]
    retention_days: 30.0               # 켤 때 이보다 오래된 사건(events)을 지움 [일]. 0 이하면 지우지 않음
    spec_mode: auto                    # auto: v2 상태가 오는 로봇만 v2 로 / v1 / v2
    v2_fresh_sec: 3.0                  # auto 에서 v2 상태가 이 안에 왔으면 v2 로봇으로 본다 [s]
    tick_period_sec: 0.2               # 시간 초과 검사 주기 [s]
    publish_period_sec: 1.0            # /control_center/tasks 다시 내는 주기 [s]
    list_limit: 50                     # /control_center/tasks 에 싣는 최근 작업 수
    allow_raw_cmd: false               # 개발용 수동 명령(화면에서 문자열을 patrol_cmd 에 그대로). 실물은 꺼 둔다
    start_armed: false                 # 작업 명령 켜진 상태로 시작할지. 실물은 꺼 두고 화면 상단 '작업 명령 켜기'로 켠다
