# 네트워크 측정 노드 파라미터 (관제 PC). 핑·토픽 수신 주기만 재고 로봇·팔에는 발행하지 않는다.
# 주소는 2026-11-16 기준 (cobot_navigation README, fleet_startup.yaml, Station PC 는 사용자 확인).
# 가짜 핑키·시험에서는 launch 에서 주소를 127.0.0.1 로 바꿔 실물 장치에 핑이 가지 않게 한다.
#
# 빠르기 두 가지: 평소엔 가볍게 계속(헬스체크), 화면 [자세히 확인] 을 누르면 잠깐 촘촘하게.
#   평소: 대상마다 ping_period_sec 에 한 번 핑 (장치 5대 × 5 s → 초당 약 80 바이트). 토픽 구독 없음.
#   자세히 확인: detail_duration_sec 동안 detail_period_sec 마다 핑 + 상태 토픽 구독해 수신 주기.
/**:
  ros__parameters:
    robots: [pinky1, pinky2, pinky3]
    robot_hosts: [192.168.45.21, 192.168.45.22, 192.168.45.23]   # robots 와 같은 순서
    station_host: 192.168.45.10    # Station PC (팔 omx1~3). 비우면 재지 않음
    router_host: 192.168.45.1      # 공유기. 비우면 재지 않음. 이 주소로 가는 연결을 '로봇망'으로 본다
    # 유선망 (영상·분석, 2026-11-22 확인). 관제 PC enp130s0 192.168.0.5 쪽. 빈 주소는 재지 않는다.
    # 카메라·브로커는 강건한 님 장치다 (5초 핑은 2026-11-22 사용자 결정).
    wired_router_host: 192.168.0.1
    wired_ids: [cctv, broker, station_wired]                   # 천장 카메라, MQTT 브로커(중계 노트북), Station PC 유선
    wired_hosts: [192.168.0.7, 192.168.0.8, 192.168.0.4]       # wired_ids 와 같은 순서
    wired_probe_ports: [18086, 1883, 22]                       # ping 이 없을 때 대상별 TCP 연결 포트
    # 영상 분석 근거 (브로커 → mqtt_zone_evidence → anomaly_monitor). 자세히 확인 때만 구독
    evidence_topics: [/anomaly_monitor/zone_evidence, /anomaly_monitor/box_evidence]
    evidence_expect_hz: 10.0     # [Hz] 이 값의 절반 미만이면 주황
    evidence_stale_sec: 1.0      # [s] 이만큼 끊기면 빨강
    arm_ids: [omx_1, omx_2, omx_3]
    status_topic_format: /{robot}/patrol_status         # 관제 도메인 100 쪽 (브릿지가 옮긴 것)
    arm_status_topic_format: /manipulation/{arm}/status  # ArmStatus, 팔 노드가 10 Hz
    publish_topic: /control_center/net_status
    check_topic: /control_center/net_check   # 자세히 확인 요청 (fleet_api 가 냄)
    publish_period_sec: 1.0
    ping_period_sec: 5.0       # [s] 평소 대상마다 한 번
    detail_period_sec: 1.0     # [s] 자세히 확인 중 대상마다 한 번
    detail_duration_sec: 10.0  # [s] 자세히 확인 길이 (토픽 수신 주기도 이 구간으로 잰다)
    ping_timeout_sec: 1        # [s] ping -W (정수). TCP 연결 시도의 기다림 시간도 같다
    # ping 명령이 없을 때(관제 도커 이미지) 이 포트로 TCP 연결을 시도해 잰다. 연결이 거절돼도 응답이라 살아 있음.
    # 로봇·Station PC 는 ssh(22) 가 열려 있다. 포트를 막은 장치는 응답 없음으로 보일 수 있다.
    tcp_probe_port: 22
    ping_window: 12            # 최근 몇 번으로 손실률·평균을 낼지 (평소 5 s 면 1분)
    ping_warn_ms: 100.0        # [ms] 평균이 이 이상이면 주황
    ping_warn_loss_pct: 10.0   # [%] 손실률이 이 이상이면 주황
    ping_bad_fails: 3          # 마지막 이만큼 연속 실패면 빨강 (평소 5 s 면 15 s)
    robot_status_stale_sec: 3.0  # [s] patrol_status 가 이만큼 끊기면 빨강 (fleet_api source_stale_sec 와 같게)
    arm_status_stale_sec: 1.0    # [s] ArmStatus 가 이만큼 끊기면 빨강 (arm_command status_stale_sec 와 같게)
    arm_status_expect_hz: 10.0   # [Hz] 이 값의 절반 미만이면 주황
    wifi_warn_dbm: -70.0         # [dBm] 관제 PC Wi-Fi 신호가 이보다 약하면 주황 (/proc/net/wireless 에 값이 있을 때)
    wifi_warn_pct: 40.0          # [%] dBm 이 없을 때 nmcli 신호 % 가 이보다 낮으면 주황
    nmcli_period_sec: 10.0       # [s] nmcli 로 Wi-Fi 연결 정보를 읽는 주기 (다시 찾기 없이)
    interface_skip_prefixes: [lo, docker, veth, br-, p2p, virbr]   # 화면에 안 보일 인터페이스
