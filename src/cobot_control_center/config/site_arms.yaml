# 현장 로봇팔 배치: 자리(구역) · 팔 이름 · 보드 시리얼 · Station PC.
# 팔 이름은 자리 순서와 1:1 로 고정한다 (ZA = omx1, ZB = omx2, ZC = omx3). 보드나 PC 를 바꿔도 팔 이름은 그대로 둔다.
#
# 지금은 관제(arm_command_node)만 이 파일을 읽어 화면에 자리·PC 를 보여 준다 (팔 목록도 여기서 정함).
# 팔 노드 등록표(cobot_manipulation/config/arm_registry.yaml)와 주행 관제 시나리오
# (cobot_fleet_control/config/scenario.yaml 의 pickup_arm·dropoff_arm)는 아직 따로 적혀 있다.
# 여기를 바꾸면 그 둘도 맞는지 확인한다 (시나리오는 지혁 님 코드).
#
# role: pickup(상차) / dropoff(하차) / warehouse(창고). 빈 칸은 화면에 '미정' 으로 나온다.
# actions: 그 자리 팔이 하는 작업 (팔 노드 작업 이름 pick·load·unload·warehouse_store·arrange_shoe 중).
#          관제 작업 시험은 여기 적힌 작업만 보낸다. [] 이면 보내지 않고, 칸이 없으면 제한하지 않는다.
# serial: OpenRB-150 보드 시리얼 (/dev/serial/by-id/usb-ROBOTIS_OpenRB-150_<시리얼>-if00).
arms:
  omx1:
    station: ZA
    role: warehouse     # 창고 하차: 핑키 위 박스를 선반에 넣기 (2026-11-21 사용자 지정)
    host: 8-OMEN        # omx2 와 같은 PC
    serial: 87A43D9B50323952582E3120FF070527   # 2026-11-21 사용자 확인 (8-OMEN 에 새로 꽂음, /dev/ttyACM1)
    actions: [warehouse_store]   # 모델 omx_1119_act 16번 (act_1119_P1_grip_moge_4000step)
  omx2:
    station: ZB
    role: pickup        # 창고 상차 (2026-11-16 확정)
    host: 8-OMEN
    serial: 77AABA9150323952582E3120FF06102E   # 2026-11-17 사용자 확인 (전에 omx1 로 잘못 적음)
    actions: [pick, load]   # ZA 와 같음: 집기 → 싣기
  omx3:
    station: ZC
    role: dropoff
    host: OMEN-11
    serial: 6D96FA0450323952582E3120FF052A1E   # 2026-11-16 OMEN-11 에서 확인
    # arrange_shoe = 신발 정리 (번들 omx_arrange_shoe_zc), load = 싣기 (번들 omx_load_zc). 2026-11-17 사용자 지정
    actions: [arrange_shoe, load]

# 배치 변경 기록 (새것이 위). 팔이나 보드·PC 를 옮기면 여기에 한 줄 남긴다.
# 팔(과 그 보드)은 자리에 붙어 있고, 노트북(PC)이 팔 사이를 옮겨 다닌다. 학습 모델은 그 팔·그 자리 것이다.
#
# 2026-11-21  ZA 팔(omx1) 작업을 창고 상차 [pick, load] → 창고 하차 [warehouse_store] 로 바꿈 (사용자 지정,
#             핑키 위 박스를 선반에 넣는 omx_1119_act 모델). 주행 시나리오 restock_arm: omx1 과 같은 작업 이름.
# 2026-11-21  ZA 팔(omx1) 보드 87A43D9B… 를 8-OMEN 에 꽂음 (사용자 확인). 77AABA91… 는 그대로 omx2.
# 2026-11-17  ZC(omx3) 작업: 신발 정리(arrange_shoe, 새 작업 이름) · 싣기(load). OMEN-11 의 shoebox_d·move_in 모델을
#             ZC 팔에 쓴다 (사용자 확인, 대시보드 v2 로 이 팔에서 돌림). 아래 11-16 'ZC 에는 쓰지 않는다' 를 대신함.
#             모델은 번들 규격 v0.1 로 ~/il_ws/bundles/omx_arrange_shoe_zc·omx_load_zc/v1 에 둠.
# 2026-11-17  8-OMEN 에 꽂힌 보드 77AABA91… 는 ZB 팔(omx2) 것으로 바로잡음 (사용자 확인).
#             omx1(ZA)은 다시 학습 중이라 연결 빼고 시리얼 비움. omx1·omx2 모두 8-OMEN 에 붙일 예정.
# 2026-11-16  자리별 작업 명시: ZA·ZB 창고 상차(pick → load), ZC 는 신발 정리 동작 준비 중(비움).
# 2026-11-16  OMEN-11 노트북: ZB 팔 학습에 쓰다가(몇 주 전까지, 날짜 미상) ZC 팔로 옮겨 붙음.
#             지금 OMEN-11 에 붙은 보드 6D96FA04… 는 ZC 팔(omx3) 것.
#             OMEN-11 에 남은 학습 데이터·모델은 ZB 팔 것이라 ZC 팔에는 쓰지 않는다. ZB 팔의 PC 는 미정.
# 2026-11-16  8-OMEN + 보드 77AABA91… 팔: ZA(상차) = omx1 로 확인.
# 2026-11-16  팔 이름을 구역 순서로 고정 (ZA = omx1, ZB = omx2, ZC = omx3).
#             팔 노드 등록표가 6D96FA04… 를 omx1 로 잘못 적고 있던 것을 바로잡음 (cobot_manipulation 37bb598).
