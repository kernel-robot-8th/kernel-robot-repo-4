# PC 상태 보고 노드 파라미터. 관제 PC 가 아닌 PC(Station PC 등)에서 이 노드만 띄운다.
# 읽기만 한다 (/proc, /sys, ip·nmcli). 다른 토픽을 구독하지 않고 명령을 내지 않는다.
/**:
  ros__parameters:
    host: station                  # 관제 화면에서 이 PC 를 찾는 이름. launch 인자 host 가 덮어쓴다
    label: Station PC
    router_host: 192.168.45.1      # 이 주소로 가는 연결을 '로봇망'으로 본다 (패킷은 보내지 않음)
    publish_topic: /control_center/host_status
    publish_period_sec: 3.0        # [s] 관제 fleet_api 의 host_stale_sec(10 s) 보다 짧게
    nmcli_period_sec: 10.0         # [s] Wi-Fi 연결 정보 읽는 주기 (다시 찾기 없이)
    interface_skip_prefixes: [lo, docker, veth, br-, p2p, virbr]
    wifi_warn_dbm: -70.0           # [dBm] 이보다 약하면 주황
    wifi_warn_pct: 40.0            # [%] dBm 이 없을 때 nmcli 신호 % 기준
    cpu_warn_pct: 90.0             # [%] CPU 사용률이 이 이상이면 주황
    mem_warn_pct: 90.0             # [%] 메모리 사용률이 이 이상이면 주황
    temp_warn_c: 80.0              # [°C] CPU 온도가 이 이상이면 주황
    disk_warn_pct: 90.0            # [%] / 디스크 사용률이 이 이상이면 주황
